군대를 보시고 그 군대를 어지럽게 하시며"}, {"n": 25, "text": "그 병거 바퀴를 벗겨서 달리기에 극난하게 하시니 애굽 사람들이 가로되 이스라엘 앞에서 우리가 도망하자 여호와가 그들을 위하여 싸워 애굽 사람들을 치는도다"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789828976072, "folderId": 1, "title": "솔로몬의 일천번제", "kind": "bible", "blocks": [{"t": "verse", "ref": "열왕기상 3장", "lines": [{"n": 3, "text": "솔로몬이 여호와를 사랑하고 그 부친 다윗의 법도를 행하되 오히려 산당에서 제사하며 분향하더라"}, {"n": 4, "text": "이에 왕이 제사하러 기브온으로 가니 거기는 산당이 큼이라 솔로몬이 그 단에 일천 번제를 드렸더니"}, {"n": 5, "text": "기브온에서 밤에 여호와께서 솔로몬의 꿈에 나타나시니라 하나님이 이르시되 내가 네게 무엇을 줄꼬 너는 구하라"}, {"n": 6, "text": "솔로몬이 가로되 주의 종 내 아비 다윗이 성실과 공의와 정직한 마음으로 주와 함께 주의 앞에서 행하므로 주께서 저에게 큰 은혜를 베푸셨고 주께서 또 저를 위하여 이 큰 은혜를 예비하시고 오늘날과 같이 저의 위에 앉을 아들을 저에게 주셨나이다"}, {"n": 7, "text": "나의 하나님 여호와여 주께서 종으로 종의 아비 다윗을 대신하여 왕이 되게 하셨사오나 종은 작은 아이라 출입할줄을 알지 못하고"}, {"n": 8, "text": "주의 빼신 백성 가운데 있나이다 저희는 큰 백성이라 수효가 많아서 셀 수도 없고 기록할 수도 없사오니"}, {"n": 9, "text": "누가 주의 이 많은 백성을 재판할 수 있사오리이까 지혜로운 마음을 종에게 주사 주의 백성을 재판하여 선악을 분별하게 하옵소서"}, {"n": 10, "text": "솔로몬이 이것을 구하매 그 말씀이 주의 마음에 맞은지라"}, {"n": 11, "text": "이에 하나님이 저에게 이르시되 네가 이것을 구하도다 자기를 위하여 수도 구하지 아니하며 부도 구하지 아니하며 자기의 원수의 생명 멸하기도 구하지 아니하고 오직 송사를 듣고 분별하는 지혜를 구하였은즉"}, {"n": 12, "text": "내가 네 말대로 하여 네게 지혜롭고 총명한 마음을 주노니 너의 전에도 너와 같은 자가 없었거니와 너의 후에도 너와 같은 자가 일어남이 없으리라"}, {"n": 13, "text": "내가 또 너의 구하지 아니한 부와 영광도 네게 주노니 네 평생에 열왕 중에 너와 같은 자가 없을 것이라"}, {"n": 14, "text": "네가 만일 네 아비 다윗의 행함 같이 내 길로 행하며 내 법도와 명령을 지키면 내가 또 네 날을 길게 하리라"}, {"n": 15, "text": "솔로몬이 깨어보니 꿈이더라 이에 예루살렘에 이르러 여호와의 언약궤 앞에 서서 번제와 수은제를 드리고 모든 신복을 위하여 잔치하였더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789828727689, "folderId": 1, "title": "에스더 '죽으면 죽으리라'", "kind": "bible", "blocks": [{"t": "verse", "ref": "에스더 4장", "lines": [{"n": 8, "text": "또 유다인을 진멸하라고 수산궁에서 내린 조서 초본을 하닥에게 주어 에스더에게 뵈어 알게 하고 또 저에게 부탁하여 왕에게 나아가서 그 앞에서 자기의 민족을 위하여 간절히 구하라 하니"}, {"n": 9, "text": "하닥이 돌아와 모르드개의 말을 에스더에게 고하매"}, {"n": 10, "text": "에스더가 하닥에게 이르되 너는 모르드개에게 고하기를"}, {"n": 11, "text": "왕의 신복과 왕의 각 도 백성이 다 알거니와 무론 남녀하고 부름을 받지 아니하고 안뜰에 들어가서 왕에게 나아가면 오직 죽이는 법이요 왕이 그 자에게 금홀을 내어 밀어야 살것이라 이제 내가 부름을 입어 왕에게 나아가지 못한지가 이미 삼십일이라 하라"}, {"n": 12, "text": "그가 에스더의 말로 모르드개에게 고하매"}, {"n": 13, "text": "모르드개가 그를 시켜 에스더에게 회답하되 너는 왕궁에 있으니 모든 유다인 중에 홀로 면하리라 생각지 말라"}, {"n": 14, "text": "이 때에 네가 만일 잠잠하여 말이 없으면 유다인은 다른데로 말미암아 놓임과 구원을 얻으려니와 너와 네 아비 집은 멸망하리라 네가 왕후의 위를 얻은 것이 이 때를 위함이 아닌지 누가 아느냐"}, {"n": 15, "text": "에스더가 명하여 모르드개에게 회답하되"}, {"n": 16, "text": "당신은 가서 수산에 있는 유다인을 다 모으고 나를 위하여 금식하되 밤낮 삼일을 먹지도 말고 마시지도 마소서 나도 나의 시녀로 더불어 이렇게 금식한 후에 규례를 어기고 왕에게 나아가리니 죽으면 죽으리이다"}, {"n": 17, "text": "모르드개가 가서 에스더의 명한대로 다 행하니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789828549008, "folderId": 1, "title": "풀무불 속 세 친구", "kind": "bible", "blocks": [{"t": "verse", "ref": "다니엘 3장", "lines": [{"n": 13, "text": "느부갓네살왕이 노하고 분하여 사드락과 메삭과 아벳느고를 끌어 오라 명하매 드디어 그 사람들을 왕의 앞으로 끌어 온지라"}, {"n": 14, "text": "느부갓네살이 그들에게 물어 가로되 사드락, 메삭, 아벳느고야 너희가 내 신을 섬기지 아니하며 내가 세운 금 신상에게 절하지 아니하니 짐짓 그리하였느냐"}, {"n": 15, "text": "이제라도 너희가 예비하였다가 언제든지 나팔과 피리와 수금과 삼현금과 양금과 생황과 및 모든 악기 소리를 듣거든 내가 만든 신상 앞에 엎드리어 절하면 좋거니와 너희가 만일 절하지 아니하면 즉시 너희를 극렬히 타는 풀무 가운데 던져 넣을 것이니 능히 너희를 내 손에서 건져낼 신이 어떤 신이겠느냐"}, {"n": 16, "text": "사드락과 메삭과 아벳느고가 왕에게 대답하여 가로되 느부갓네살이여 우리가 이 일에 대하여 왕에게 대답할 필요가 없나이다"}, {"n": 17, "text": "만일 그럴 것이면 왕이여 우리가 섬기는 우리 하나님이 우리를 극렬히 타는 풀무 가운데서 능히 건져내시겠고 왕의 손에서도 건져내시리이다"}, {"n": 18, "text": "그리 아니하실찌라도 왕이여 우리가 왕의 신들을 섬기지도 아니하고 왕의 세우신 금 신상에게 절하지도 아니할 줄을 아옵소서"}]}, {"t": "memo", "text": "(중략)"}, {"t": "verse", "ref": "", "lines": [{"n": 23, "text": "이 세 사람 사드락과 메삭과 아벳느고는 결박된채 극렬히 타는 풀무 가운데 떨어졌더라"}, {"n": 24, "text": "때에 느부갓네살왕이 놀라 급히 일어나서 모사들에게 물어가로되 우리가 결박하여 불 가운데 던진 자는 세 사람이 아니었느냐 그들이 왕에게 대답하여 가로되 왕이여 옳소이다"}, {"n": 25, "text": "왕이 또 말하여 가로되 내가 보니 결박되지 아니한 네 사람이 불 가운데로 다니는데 상하지도 아니하였고 그 네째의 모양은 신들의 아들과 같도다 하고"}, {"n": 26, "text": "느부갓네살이 극렬히 타는 풀무 아구 가까이 가서 불러 가로되 지극히 높으신 하나님의 종 사드락, 메삭, 아벳느고야 나와서 이리로 오라 하매 사드락과 메삭과 아벳느고가 불 가운데서 나온지라"}, {"n": 27, "text": "방백과 수령과 도백과 왕의 모사들이 모여 이 사람들을 본즉 불이 능히 그 몸을 해하지 못하였고 머리털도 그슬리지 아니하였고 고의 빛도 변하지 아니하였고 불 탄 냄새도 없었더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789828219074, "folderId": 1, "title": "다윗과 골리앗", "kind": "bible", "blocks": [{"t": "verse", "ref": "사무엘상 17장", "lines": [{"n": 39, "text": "다윗이 칼을 군복 위에 차고는 익숙치 못하므로 시험적으로 걸어 보다가 사울에게 고하되 익숙치 못하니 이것을 입고 가지 못하겠나이다 하고 곧 벗고"}, {"n": 40, "text": "손에 막대기를 가지고 시내에서 매끄러운 돌 다섯을 골라서 자기 목자의 제구 곧 주머니에 넣고 손에 물매를 가지고 블레셋 사람에게로 나아가니라"}, {"n": 41, "text": "블레셋 사람이 점점 행하여 다윗에게로 나아오는데 방패 든 자가 앞섰더라"}, {"n": 42, "text": "그 블레셋 사람이 둘러보다가 다윗을 보고 업신여기니 이는 그가 젊고 붉고 용모가 아름다움이라"}, {"n": 43, "text": "블레셋 사람이 다윗에게 이르되 네가 나를 개로 여기고 막대기를 가지고 내게 나아왔느냐 하고 그 신들의 이름으로 다윗을 저주하고"}, {"n": 44, "text": "또 이르되 내게로 오라 내가 네 고기를 공중의 새들과 들짐승들에게 주리라"}, {"n": 45, "text": "다윗이 블레셋 사람에게 이르되 너는 칼과 창과 단창으로 내게 오거니와 나는 만군의 여호와의 이름 곧 네가 모욕하는 이스라엘 군대의 하나님의 이름으로 네게 가노라"}, {"n": 46, "text": "오늘 여호와께서 너를 내 손에 붙이시리니 내가 너를 쳐서 네 머리를 베고 블레셋 군대의 시체로 오늘날 공중의 새와 땅의 들짐승에게 주어 온 땅으로 이스라엘에 하나님이 계신줄 알게 하겠고"}, {"n": 47, "text": "또 여호와의 구원하심이 칼과 창에 있지 아니함을 이 무리로 알게 하리라 전쟁은 여호와께 속한 것인즉 그가 너희를 우리 손에 붙이시리라"}, {"n": 48, "text": "블레셋 사람이 일어나 다윗에게로 마주 가까이 올 때에 다윗이 블레셋 사람에게로 마주 그 항오를 향하여 빨리 달리며"}, {"n": 49, "text": "손을 주머니에 넣어 돌을 취하여 물매로 던져 블레셋 사람의 이마를 치매 돌이 그 이마에 박히니 땅에 엎드러지니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789827982980, "folderId": 1, "title": "소금 기둥이 된 롯의 아내", "kind": "bible", "blocks": [{"t": "verse", "lines": [{"h": "창세기 19장"}, {"n": 13, "text": "그들에 대하여 부르짖음이 여호와 앞에 크므로 여호와께서 우리로 이곳을 멸하러 보내셨나니 우리가 멸하리라"}, {"n": 14, "text": "롯이 나가서 그 딸들과 정혼한 사위들에게 고하여 이르되 여호와께서 이 성을 멸하실터이니 너희는 일어나 이곳에서 떠나라 하되 그 사위들이 농담으로 여겼더라"}, {"n": 15, "text": "동틀 때에 천사가 롯을 재촉하여 가로되 일어나 여기 있는 네 아내와 두 딸을 이끌라 이 성의 죄악 중에 함께 멸망할까 하노라"}, {"n": 16, "text": "그러나 롯이 지체하매 그 사람들이 롯의 손과 그 아내의 손과 두 딸의 손을 잡아 인도하여 성밖에 두니 여호와께서 그에게 인자를 더하심이었더라"}, {"n": 17, "text": "그 사람들이 그들을 밖으로 이끌어낸 후에 이르되 도망하여 생명을 보존하라 돌아보거나 들에 머무르거나 하지 말고 산으로 도망하여 멸망함을 면하라"}, {"n": 18, "text": "롯이 그들에게 이르되 내 주여 그리 마옵소서"}, {"n": 19, "text": "종이 주께 은혜를 얻었고 주께서 큰 인자를 내게 베푸사 내 생명을 구원하시오나 내가 도망하여 산까지 갈 수 없나이다 두렵건대 재앙을 만나 죽을까 하나이다"}, {"n": 20, "text": "보소서 저 성은 도망하기 가깝고 작기도 하오니 나로 그곳에 도망하게 하소서 이는 작은 성이 아니니이까 내 생명이 보존되리이다"}, {"n": 21, "text": "그가 그에게 이르되 내가 이 일에도 네 소원을 들었은즉 너의 말하는 성을 멸하지 아니하리니"}, {"n": 22, "text": "그리로 속히 도망하라 네가 거기 이르기까지는 내가 아무 일도 행할 수 없노라 하였더라 그러므로 그 성 이름을 소알이라 불렀더라"}, {"n": 23, "text": "롯이 소알에 들어갈 때에 해가 돋았더라"}, {"n": 24, "text": "여호와께서 하늘 곧 여호와에게로서 유황과 불을 비 같이 소돔과 고모라에 내리사"}, {"n": 25, "text": "그 성들과 온 들과 성에 거하는 모든 백성과 땅에 난 것을 다 엎어 멸하셨더라"}, {"n": 26, "text": "롯의 아내는 뒤를 돌아 본고로 소금 기둥이 되었더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789827817627, "folderId": 1, "title": "요셉과 형제들의 재회", "kind": "bible", "blocks": [{"t": "verse", "ref": "창세기 45장", "lines": [{"n": 2, "text": "요셉이 방성대곡하니 애굽 사람에게 들리며 바로의 궁중에 들리더라"}, {"n": 3, "text": "요셉이 그 형들에게 이르되 나는 요셉이라 내 아버지께서 아직 살아 계시니이까 형들이 그 앞에서 놀라서 능히 대답하지 못하는지라"}, {"n": 4, "text": "요셉이 형들에게 이르되 내게로 가까이 오소서 그들이 가까이 가니 가로되 나는 당신들의 아우 요셉이니 당신들이 애굽에 판 자라"}, {"n": 5, "text": "당신들이 나를 이곳에 팔았으므로 근심하지 마소서 한탄하지 마소서 하나님이 생명을 구원하시려고 나를 당신들 앞서 보내셨나이다"}, {"n": 6, "text": "이 땅에 이년 동안 흉년이 들었으나 아직 오년은 기경도 못하고 추수도 못할찌라"}, {"n": 7, "text": "하나님이 큰 구원으로 당신들의 생명을 보존하고 당신들의 후손을 세상에 두시려고 나를 당신들 앞서 보내셨나니"}, {"n": 8, "text": "그런즉 나를 이리로 보낸 자는 당신들이 아니요 하나님이시라 하나님이 나로 바로의 아비를 삼으시며 그 온 집의 주를 삼으시며 애굽 온 땅의 치리자를 삼으셨나이다"}, {"n": 9, "text": "당신들은 속히 아버지께로 올라가서 고하기를 아버지의 아들 요셉의 말에 하나님이 나를 애굽 전국의 주로 세우셨으니 내게로 지체말고 내려오사"}, {"n": 10, "text": "아버지의 아들들과 아버지의 손자들과 아버지의 양과 소와 모든 소유가 고센 땅에 있어서 나와 가깝게 하소서"}, {"n": 11, "text": "흉년이 아직 다섯해가 있으니 내가 거기서 아버지를 봉양하리이다 아버지와 아버지의 가속과 아버지의 모든 소속이 결핍할까 하나이다 하더라 하소서"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789827698702, "folderId": 1, "title": "가인과 아벨", "kind": "bible", "blocks": [{"t": "verse", "ref": "창세기 4장", "lines": [{"n": 2, "text": "그가 또 가인의 아우 아벨을 낳았는데 아벨은 양 치는 자이었고 가인은 농사하는 자이었더라"}, {"n": 3, "text": "세월이 지난 후에 가인은 땅의 소산으로 제물을 삼아 여호와께 드렸고"}, {"n": 4, "text": "아벨은 자기도 양의 첫 새끼와 그 기름으로 드렸더니 여호와께서 아벨과 그 제물은 열납하셨으나"}, {"n": 5, "text": "가인과 그 제물은 열납하지 아니하신지라 가인이 심히 분하여 안색이 변하니"}, {"n": 6, "text": "여호와께서 가인에게 이르시되 네가 분하여 함은 어찜이며 안색이 변함은 어찜이뇨"}, {"n": 7, "text": "네가 선을 행하면 어찌 낯을 들지 못하겠느냐 선을 행치 아니하면 죄가 문에 엎드리느니라 죄의 소원은 네게 있으나 너는 죄를 다스릴찌니라"}, {"n": 8, "text": "가인이 그 아우 아벨에게 고하니라 그 후 그들이 들에 있을 때에 가인이 그 아우 아벨을 쳐 죽이니라"}, {"n": 9, "text": "여호와께서 가인에게 이르시되 네 아우 아벨이 어디 있느냐 그가 가로되 내가 알지 못하나이다 내가 내 아우를 지키는 자니이까"}, {"n": 10, "text": "가라사대 네가 무엇을 하였느냐 네 아우의 핏소리가 땅에서부터 내게 호소하느니라"}, {"n": 11, "text": "땅이 그 입을 벌려 네 손에서부터 네 아우의 피를 받았은즉 네가 땅에서 저주를 받으리니"}, {"n": 12, "text": "네가 밭 갈아도 땅이 다시는 그 효력을 네게 주지 아니할 것이요 너는 땅에서 피하며 유리하는 자가 되리라"}, {"n": 13, "text": "가인이 여호와께 고하되 내 죄벌이 너무 중하여 견딜 수 없나이다"}, {"n": 14, "text": "주께서 오늘 이 지면에서 나를 쫓아내시온즉 내가 주의 낯을 뵈옵지 못하리니 내가 땅에서 피하며 유리하는 자가 될찌라 무릇 나를 만나는 자가 나를 죽이겠나이다"}, {"n": 15, "text": "여호와께서 그에게 이르시되 그렇지 않다 가인을 죽이는 자는 벌을 칠배나 받으리라 하시고 가인에게 표를 주사 만나는 누구에게든지 죽임을 면케 하시니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789827575720, "folderId": 1, "title": "아브라함과 이삭", "kind": "bible", "blocks": [{"t": "verse", "ref": "창세기 22장", "lines": [{"n": 1, "text": "그 일 후에 하나님이 아브라함을 시험하시려고 그를 부르시되 아브라함아 하시니 그가 가로되 내가 여기 있나이다"}, {"n": 2, "text": "여호와께서 가라사대 네 아들 네 사랑하는 독자 이삭을 데리고 모리아 땅으로 가서 내가 네게 지시하는 한 산 거기서 그를 번제로 드리라"}, {"n": 3, "text": "아브라함이 아침에 일찌기 일어나 나귀에 안장을 지우고 두 사환과 그 아들 이삭을 데리고 번제에 쓸 나무를 쪼개어 가지고 떠나 하나님의 자기에게 지시하시는 곳으로 가더니"}, {"n": 4, "text": "제 삼일에 아브라함이 눈을 들어 그곳을 멀리 바라본지라"}, {"n": 5, "text": "이에 아브라함이 사환에게 이르되 너희는 나귀와 함께 여기서 기다리라 내가 아이와 함께 저기 가서 경배하고 너희에게로 돌아오리라 하고"}, {"n": 6, "text": "아브라함이 이에 번제 나무를 취하여 그 아들 이삭에게 지우고 자기는 불과 칼을 손에 들고 두 사람이 동행하더니"}, {"n": 7, "text": "이삭이 그 아비 아브라함에게 말하여 가로되 내 아버지여 하니 그가 가로되 내 아들아 내가 여기 있노라 이삭이 가로되 불과 나무는 있거니와 번제할 어린 양은 어디 있나이까"}, {"n": 8, "text": "아브라함이 가로되 아들아 번제할 어린 양은 하나님이 자기를 위하여 친히 준비하시리라 하고 두 사람이 함께 나아가서"}, {"n": 9, "text": "하나님이 그에게 지시하신 곳에 이른지라 이에 아브라함이 그곳에 단을 쌓고 나무를 벌여놓고 그 아들 이삭을 결박하여 단 나무 위에 놓고"}, {"n": 10, "text": "손을 내밀어 칼을 잡고 그 아들을 잡으려 하더니"}, {"n": 11, "text": "여호와의 사자가 하늘에서부터 그를 불러 가라사대 아브라함아 아브라함아 하시는지라 아브라함이 가로되 내가 여기 있나이다 하매"}, {"n": 12, "text": "사자가 가라사대 그 아이에게 네 손을 대지 말라 아무 일도 그에게 하지 말라 네가 네 아들 네 독자라도 내게 아끼지 아니하였으니 내가 이제야 네가 하나님을 경외하는 줄을 아노라"}, {"n": 13, "text": "아브라함이 눈을 들어 살펴본즉 한 수양이 뒤에 있는데 뿔이 수풀에 걸렸는지라 아브라함이 가서 그 수양을 가져다가 아들을 대신하여 번제로 드렸더라"}, {"n": 14, "text": "아브라함이 그 땅 이름을 여호와이레라 하였으므로 오늘까지 사람들이 이르기를 여호와의 산에서 준비되리라 하더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1788502263567, "folderId": 1, "title": "열 명의 나병환자", "kind": "bible", "blocks": [{"t": "verse", "ref": "누가복음 17장", "lines": [{"n": 11, "text": "예수께서 예루살렘으로 가실 때에 사마리아와 갈릴리 사이로 지나가시다가"}, {"n": 12, "text": "한 촌에 들어가시니 문둥병자 열 명이 예수를 만나 멀리 서서"}, {"n": 13, "text": "소리를 높여 가로되 예수 선생님이여 우리를 긍휼히 여기소서 하거늘"}, {"n": 14, "text": "보시고 가라사대 가서 제사장들에게 너희 몸을 보이라 하셨더니 저희가 가다가 깨끗함을 받은지라"}, {"n": 15, "text": "그 중에 하나가 자기의 나은 것을 보고 큰 소리로 하나님께 영광을 돌리며 돌아와"}, {"n": 16, "text": "예수의 발아래 엎드리어 사례하니 저는 사마리아인이라"}, {"n": 17, "text": "예수께서 대답하여 가라사대 열 사람이 다 깨끗함을 받지 아니하였느냐 그 아홉은 어디 있느냐"}, {"n": 18, "text": "이 이방인 외에는 하나님께 영광을 돌리러 돌아온 자가 없느냐 하시고"}, {"n": 19, "text": "그에게 이르시되 일어나 가라 네 믿음이 너를 구원하였느니라 하시더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1788501758421, "folderId": 1, "title": "잃은 양 한마리", "kind": "bible", "blocks": [{"t": "verse", "ref": "누가복음 15장", "lines": [{"n": 1, "text": "모든 세리와 죄인들이 말씀을 들으러 가까이 나아오니"}, {"n": 2, "text": "바리새인과 서기관들이 원망하여 가로되 이 사람이 죄인을 영접하고 음식을 같이 먹는다 하더라"}, {"n": 3, "text": "예수께서 저희에게 이 비유로 이르시되"}, {"n": 4, "text": "너희 중에 어느 사람이 양 일백 마리가 있는데 그 중에 하나를 잃으면 아흔 아홉 마리를 들에 두고 그 잃은 것을 찾도록 찾아 다니지 아니하느냐"}, {"n": 5, "text": "또 찾은즉 즐거워 어깨에 메고"}, {"n": 6, "text": "집에 와서 그 벗과 이웃을 불러 모으고 말하되 나와 함께 즐기자 나의 잃은 양을 찾았노라 하리라"}, {"n": 7, "text": "내가 너희에게 이르노니 이와 같이 죄인 하나가 회개하면 하늘에서는 회개할 것 없는 의인 아흔 아홉을 인하여 기뻐하는 것보다 더하리라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1788501541963, "folderId": 1, "title": "예수님과 가나 혼인잔치", "kind": "bible", "blocks": [{"t": "verse", "ref": "요한복음 2장", "lines": [{"n": 1, "text": "사흘 되던 날에 갈릴리 가나에 혼인이 있어 예수의 어머니도 거기 계시고"}, {"n": 2, "text": "예수와 그 제자들도 혼인에 청함을 받았더니"}, {"n": 3, "text": "포도주가 모자란지라 예수의 어머니가 예수에게 이르되 저희에게 포도주가 없다 하니"}, {"n": 4, "text": "예수께서 가라사대 여자여 나와 무슨 상관이 있나이까 내 때가 아직 이르지 못하였나이다"}, {"n": 5, "text": "그 어머니가 하인들에게 이르되 너희에게 무슨 말씀을 하시든지 그대로 하라 하니라"}, {"n": 6, "text": "거기 유대인의 결례를 따라 두 세 통 드는 돌항아리 여섯이 놓였는지라"}, {"n": 7, "text": "예수께서 저희에게 이르시되 항아리에 물을 채우라 하신즉 아구까지 채우니"}, {"n": 8, "text": "이제는 떠서 연회장에게 갖다 주라 하시매 갖다 주었더니"}, {"n": 9, "text": "연회장은 물로 된 포도주를 맛보고 어디서 났는지 알지 못하되 물 떠온 하인들은 알더라 연회장이 신랑을 불러"}, {"n": 10, "text": "말하되 사람마다 먼저 좋은 포도주를 내고 취한 후에 낮은 것을 내거늘 그대는 지금까지 좋은 포도주를 두었도다 하니라"}, {"n": 11, "text": "예수께서 이 처음 표적을 갈릴리 가나에서 행하여 그 영광을 나타내시매 제자들이 그를 믿으니라"}, {"n": 12, "text": "그 후에 예수께서 그 어머니와 형제들과 제자들과 함께 가버나움으로 내려가 거기 여러 날 계시지 아니하시니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1788501331795, "folderId": 1, "title": "자비를 베푼 사마리아 사람", "kind": "bible", "blocks": [{"t": "verse", "ref": "누가복음 10장", "lines": [{"n": 25, "text": "어떤 율법사가 일어나 예수를 시험하여 가로되 선생님 내가 무엇을 하여야 영생을 얻으리이까"}, {"n": 26, "text": "예수께서 이르시되 율법에 무엇이라 기록되었으며 네가 어떻게 읽느냐"}, {"n": 27, "text": "대답하여 가로되 네 마음을 다하며 목숨을 다하며 힘을 다하며 뜻을 다하여 주 너의 하나님을 사랑하고 또한 네 이웃을 네 몸과 같이 사랑하라 하였나이다"}, {"n": 28, "text": "예수께서 이르시되 네 대답이 옳도다 이를 행하라 그러면 살리라 하시니"}, {"n": 29, "text": "이 사람이 자기를 옳게 보이려고 예수께 여짜오되 그러면 내 이웃이 누구오니이까"}, {"n": 30, "text": "예수께서 대답하여 가라사대 어떤 사람이 예루살렘에서 여리고로 내려가다가 강도를 만나매 강도들이 그 옷을 벗기고 때려 거반 죽은 것을 버리고 갔더라"}, {"n": 31, "text": "마침 한 제사장이 그 길로 내려가다가 그를 보고 피하여 지나가고"}, {"n": 32, "text": "또 이와 같이 한 레위인도 그곳에 이르러 그를 보고 피하여 지나가되"}, {"n": 33, "text": "어떤 사마리아인은 여행하는 중 거기 이르러 그를 보고 불쌍히 여겨"}, {"n": 34, "text": "가까이 가서 기름과 포도주를 그 상처에 붓고 싸매고 자기 짐승에 태워 주막으로 데리고 가서 돌보아 주고"}, {"n": 35, "text": "이튿날에 데나리온 둘을 내어 주막 주인에게 주며 가로되 이 사람을 돌보아 주라 부비가 더 들면 내가 돌아 올 때에 갚으리라 하였으니"}, {"n": 36, "text": "네 의견에는 이 세 사람 중에 누가 강도 만난 자의 이웃이 되겠느냐"}, {"n": 37, "text": "가로되 자비를 베푼 자니이다 예수께서 이르시되 가서 너도 이와 같이 하라 하시니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1788500844547, "folderId": 1, "title": "예수님과 중풍병자의 친구들", "kind": "bible", "blocks": [{"t": "verse", "ref": "마가복음 2장", "lines": [{"n": 1, "text": "수일 후에 예수께서 다시 가버나움에 들어가시니 집에 계신 소문이 들린지라"}, {"n": 2, "text": "많은 사람이 모여서 문 앞에라도 용신할 수 없게 되었는데 예수께서 저희에게 도를 말씀하시더니"}, {"n": 3, "text": "사람들이 한 중풍병자를 네 사람에게 메워 가지고 예수께로 올쌔"}, {"n": 4, "text": "무리를 인하여 예수께 데려갈 수 없으므로 그 계신 곳의 지붕을 뜯어 구멍을 내고 중풍병자의 누운 상을 달아내리니"}, {"n": 5, "text": "예수께서 저희의 믿음을 보시고 중풍병자에게 이르시되 소자야 네 죄 사함을 받았느니라 하시니"}, {"n": 6, "text": "어떤 서기관들이 거기 앉아서 마음에 의논하기를"}, {"n": 7, "text": "이 사람이 어찌 이렇게 말하는가 참람하도다 오직 하나님 한 분 외에는 누가 능히 죄를 사하겠느냐"}, {"n": 8, "text": "저희가 속으로 이렇게 의논하는 줄을 예수께서 곧 중심에 아시고 이르시되 어찌하여 이것을 마음에 의논하느냐"}, {"n": 9, "text": "중풍병자에게 네 죄 사함을 받았느니라 하는 말과 일어나 네 상을 가지고 걸어가라 하는 말이 어느 것이 쉽겠느냐"}, {"n": 10, "text": "그러나 인자가 땅에서 죄를 사하는 권세가 있는 줄을 너희로 알게 하려하노라 하시고 중풍병자에게 말씀하시되"}, {"n": 11, "text": "내가 네게 이르노니 일어나 네 상을 가지고 집으로 가라 하시니"}, {"n": 12, "text": "그가 일어나 곧 상을 가지고 모든 사람 앞에서 나가거늘 저희가 다 놀라 영광을 하나님께 돌리며 가로되 우리가 이런 일을 도무지 보지 못하였다 하더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1788500540652, "folderId": 1, "title": "예수님과 삭개오", "kind": "bible", "blocks": [{"t": "verse", "ref": "누가복음 19장", "lines": [{"n": 1, "text": "예수께서 여리고로 들어 지나가시더라"}, {"n": 2, "text": "삭개오라 이름하는 자가 있으니 세리장이요 또한 부자라"}, {"n": 3, "text": "저가 예수께서 어떠한 사람인가 하여 보고자 하되 키가 작고 사람이 많아 할 수 없어"}, {"n": 4, "text": "앞으로 달려가 보기 위하여 뽕나무에 올라가니 이는 예수께서 그리로 지나가시게 됨이러라"}, {"n": 5, "text": "예수께서 그곳에 이르사 우러러 보시고 이르시되 삭개오야 속히 내려오라 내가 오늘 네 집에 유하여야 하겠다 하시니"}, {"n": 6, "text": "급히 내려와 즐거워하며 영접하거늘"}, {"n": 7, "text": "뭇사람이 보고 수군거려 가로되 저가 죄인의 집에 유하러 들어갔도다 하더라"}, {"n": 8, "text": "삭개오가 서서 주께 여짜오되 주여 보시옵소서 내 소유의 절반을 가난한 자들에게 주겠사오며 만일 뉘 것을 토색한 일이 있으면 사배나 갚겠나이다"}, {"n": 9, "text": "예수께서 이르시되 오늘 구원이 이 집에 이르렀으니 이 사람도 아브라함의 자손임이로다"}, {"n": 10, "text": "인자의 온 것은 잃어버린 자를 찾아 구원하려 함이니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1788410538962, "folderId": 1, "title": "다니엘과 사자굴", "kind": "bible", "blocks": [{"t": "verse", "ref": "다니엘 6장", "lines": [{"n": 10, "text": "다니엘이 이 조서에 어인이 찍힌 것을 알고도 자기 집에 돌아가서는 그 방의 예루살렘으로 향하여 열린 창에서 전에 행하던대로 하루 세번씩 무릎을 꿇고 기도하며 그 하나님께 감사하였더라"}, {"n": 11, "text": "그 무리들이 모여서 다니엘이 자기 하나님 앞에 기도하며 간구하는 것을 발견하고"}, {"n": 12, "text": "이에 그들이 나아가서 왕의 금령에 대하여 왕께 아뢰되 왕이여 왕이 이미 금령에 어인을 찍어서 이제부터 삼십일 동안에 누구든지 왕 외에 어느 신에게나 사람에게 구하면 사자 굴에 던져 넣기로 하지 아니하였나이까 왕이 대답하여 가로되 이 일이 적실하니 메대와 바사의 변개치 아니하는 규례대로 된 것이니라"}, {"n": 13, "text": "그들이 왕 앞에서 대답하여 가로되 왕이여 사로잡혀 온 유다 자손 중에 그 다니엘이 왕과 왕의 어인이 찍힌 금령을 돌아보지 아니하고 하루 세번씩 기도하나이다"}, {"n": 14, "text": "왕이 이 말을 듣고 그로 인하여 심히 근심하여 다니엘을 구원하려고 마음을 쓰며 그를 건져 내려고 힘을 다하여 해가 질 때까지 이르매"}, {"n": 15, "text": "그 무리들이 또 모여 왕에게로 나아와서 왕께 말씀하되 왕이여 메대와 바사의 규례를 아시거니와 왕의 세우신 금령과 법도는 변개하지 못할 것이니이다"}, {"n": 16, "text": "이에 왕이 명하매 다니엘을 끌어다가 사자 굴에 던져 넣는지라 왕이 다니엘에게 일러 가로되 너의 항상 섬기는 네 하나님이 너를 구원하시리라 하니라"}, {"n": 17, "text": "이에 돌을 굴려다가 굴 아구를 막으매 왕이 어인과 귀인들의 인을 쳐서 봉하였으니 이는 다니엘 처치한 것을 변개함이 없게 하려함이었더라"}, {"n": 18, "text": "왕이 궁에 돌아가서는 밤이 맟도록 금식하고 그 앞에 기악을 그치고 침수를 폐하니라"}, {"n": 19, "text": "이튿날에 왕이 새벽에 일어나 급히 사자굴로 가서"}, {"n": 20, "text": "다니엘의 든 굴에 가까이 이르러는 슬피 소리질러 다니엘에게 물어 가로되 사시는 하나님의 종 다니엘아 너의 항상 섬기는 네 하나님이 사자에게서 너를 구원하시기에 능하셨느냐"}, {"n": 21, "text": "다니엘이 왕에게 고하되 왕이여 원컨대 왕은 만세수를 하옵소서"}, {"n": 22, "text": "나의 하나님이 이미 그 천사를 보내어 사자들의 입을 봉하셨으므로 사자들이 나를 상해치 아니하였사오니 이는 나의 무죄함이 그 앞에 명백함이오며 또 왕이여 나는 왕의 앞에도 해를 끼치지 아니하였나이다"}, {"n": 23, "text": "왕이 심히 기뻐서 명하여 다니엘을 굴에서 올리라 하매 그들이 다니엘을 굴에서 올린즉 그 몸이 조금도 상하지 아니하였으니 이는 그가 자기 하나님을 의뢰함이었더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1788348443946, "folderId": 1, "title": "엘리사와 과부의 기름 그릇", "kind": "bible", "blocks": [{"t": "verse", "ref": "열왕기하 4장", "lines": [{"n": 1, "text": "선지자의 생도의 아내 중에 한 여인이 엘리사에게 부르짖어 가로되 당신의 종 나의 남편이 이미 죽었는데 당신의 종이 여호와를 경외한 줄은 당신이 아시는 바니이다 이제 채주가 이르러 나의 두 아이를 취하여 그 종을 삼고자 하나이다"}, {"n": 2, "text": "엘리사가 저에게 이르되 내가 너를 위하여 어떻게 하랴 네 집에 무엇이 있는지 내게 고하라 저가 가로되 계집종의 집에 한 병 기름 외에는 아무 것도 없나이다"}, {"n": 3, "text": "가로되 너는 밖에 나가서 모든 이웃에게 그릇을 빌라 빈 그릇을 빌되 조금 빌지 말고"}, {"n": 4, "text": "너는 네 두 아들과 함께 들어가서 문을 닫고 그 모든 그릇에 기름을 부어서 차는대로 옮겨 놓으라"}, {"n": 5, "text": "여인이 물러가서 그 두 아들과 함께 문을 닫은 후에 저희는 그릇을 그에게로 가져 오고 그는 부었더니"}, {"n": 6, "text": "그릇에 다 찬지라 여인이 아들에게 이르되 또 그릇을 내게로 가져 오라 아들이 가로되 다른 그릇이 없나이다 하니 기름이 곧 그쳤더라"}, {"n": 7, "text": "그 여인이 하나님의 사람에게 나아가서 고한대 저가 가로되 너는 가서 기름을 팔아 빚을 갚고 남은 것으로 너와 네 두 아들이 생활하라 하였더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1788348334679, "folderId": 1, "title": "엘리사와 나아만 장군", "kind": "bible", "blocks": [{"t": "verse", "ref": "열왕기하 5장", "lines": [{"n": 1, "text": "아람 왕의 군대장관 나아만은 그 주인 앞에서 크고 존귀한 자니 이는 여호와께서 전에 저로 아람을 구원하게 하셨음이라 저는 큰 용사나 문둥병자더라"}, {"n": 2, "text": "전에 아람 사람이 떼를 지어 나가서 이스라엘 땅에서 작은 계집아이 하나를 사로잡으매 저가 나아만의 아내에게 수종들더니"}, {"n": 3, "text": "그 주모에게 이르되 우리 주인이 사마리아에 계신 선지자 앞에 계셨으면 좋겠나이다 저가 그 문둥병을 고치리이다"}, {"n": 4, "text": "나아만이 들어가서 그 주인에게 고하여 가로되 이스라엘 땅에서 온 계집아이의 말이 이러이러하더이다"}, {"n": 5, "text": "아람 왕이 가로되 갈찌어다 이제 내가 이스라엘 왕에게 글을 보내리라 나아만이 곧 떠날쌔 은 십 달란트와 금 육천개와 의복 열벌을 가지고 가서"}, {"n": 6, "text": "이스라엘 왕에게 그 글을 전하니 일렀으되 내가 내 신하 나아만을 당신에게 보내오니 이 글이 당신에게 이르거든 당신은 그 문둥병을 고쳐주소서 하였더라"}, {"n": 7, "text": "이스라엘 왕이 그 글을 읽고 자기 옷을 찢으며 가로되 내가 어찌 하나님이관대 능히 사람을 죽이며 살릴 수 있으랴 저가 어찌하여 사람을 내게 보내어 그 문둥병을 고치라 하느냐 너희는 깊이 생각하고 저 왕이 틈을 타서 나로 더불어 시비하려 함인줄 알라 하니라"}, {"n": 8, "text": "하나님의 사람 엘리사가 이스라엘 왕이 자기 옷을 찢었다 함을 듣고 왕에게 보내어 가로되 왕이 어찌하여 옷을 찢었나이까 그 사람을 내게로 오게 하소서 저가 이스라엘 중에 선지자가 있는 줄을 알리이다"}, {"n": 9, "text": "나아만이 이에 말들과 병거들을 거느리고 이르러 엘리사의 집 문에 서니"}, {"n": 10, "text": "엘리사가 사자를 저에게 보내어 가로되 너는 가서 요단강에 몸을 일곱번 씻으라 네 살이 여전하여 깨끗하리라"}, {"n": 11, "text": "나아만이 노하여 물러가며 가로되 내 생각에는 저가 내게로 나아와 서서 그 하나님 여호와의 이름을 부르고 당처 위에 손을 흔들어 문둥병을 고칠까 하였도다"}, {"n": 12, "text": "다메섹강 아마나와 바르발은 이스라엘 모든 강물보다 낫지 아니하냐 내가 거기서 몸을 씻으면 깨끗하게 되지 아니하랴 하고 몸을 돌이켜 분한 모양으로 떠나니"}, {"n": 13, "text": "그 종들이 나아와서 말하여 가로되 내 아버지여 선지자가 당신을 명하여 큰 일을 행하라 하였더면 행치 아니하였으리이까 하물며 당신에게 이르기를 씻어 깨끗하게 하라 함이리이까"}, {"n": 14, "text": "나아만이 이에 내려가서 하나님의 사람의 말씀대로 요단강에 일곱번 몸을 잠그니 그 살이 여전하여 어린아이의 살 같아서 깨끗하게 되었더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1788348217134, "folderId": 1, "title": "엘리야와 사르밧 과부", "kind": "bible", "blocks": [{"t": "verse", "ref": "열왕기상 17장", "lines": [{"n": 8, "text": "여호와의 말씀이 엘리야에게 임하여 가라사대"}, {"n": 9, "text": "너는 일어나 시돈에 속한 사르밧으로 가서 거기 유하라 내가 그곳 과부에게 명하여 너를 공궤하게 하였느니라"}, {"n": 10, "text": "저가 일어나 사르밧으로 가서 성문에 이를 때에 한 과부가 그곳에서 나무가지를 줍는지라 이에 불러 가로되 청컨대 그릇에 물을 조금 가져다가 나로 마시게 하라"}, {"n": 11, "text": "저가 가지러 갈때에 엘리야가 저를 불러 가로되 청컨대 네 손에 떡 한 조각을 내게로 가져오라"}, {"n": 12, "text": "저가 가로되 당신의 하나님 여호와의 사심을 가리켜 맹세하노니 나는 떡이 없고 다만 통에 가루 한 움큼과 병에 기름 조금 뿐이라 내가 나무가지 두엇을 주워다가 나와 내 아들을 위하여 음식을 만들어 먹고 그 후에는 죽으리라"}, {"n": 13, "text": "엘리야가 저에게 이르되 두려워 말고 가서 네 말대로 하려니와 먼저 그것으로 나를 위하여 작은 떡 하나를 만들어 내게로 가져오고 그 후에 너와 네 아들을 위하여 만들라"}, {"n": 14, "text": "이스라엘 하나님 여호와의 말씀이 나 여호와가 비를 지면에 내리는 날까지 그 통의 가루는 다하지 아니하고 그 병의 기름은 없어지지 아니하리라 하셨느니라"}, {"n": 15, "text": "저가 가서 엘리야의 말대로 하였더니 저와 엘리야와 식구가 여러날 먹었으나"}, {"n": 16, "text": "여호와께서 엘리야로 하신 말씀 같이 통의 가루가 다하지 아니하고 병의 기름이 없어지지 아니하니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1790200000000, "folderId": 1788947115563, "title": "그 중의 제일은 사랑이라", "kind": "bible", "blocks": [{"t": "verse", "ref": "고린도전서 13장", "lines": [{"n": 1, "text": "내가 사람의 방언과 천사의 말을 할찌라도 사랑이 없으면 소리나는 구리와 울리는 꽹과리가 되고"}, {"n": 2, "text": "내가 예언하는 능이 있어 모든 비밀과 모든 지식을 알고 또 산을 옮길만한 모든 믿음이 있을찌라도 사랑이 없으면 내가 아무 것도 아니요"}, {"n": 3, "text": "내가 내게 있는 모든 것으로 구제하고 또 내 몸을 불사르게 내어 줄찌라도 사랑이 없으면 내게 아무 유익이 없느니라"}, {"n": 4, "text": "사랑은 오래 참고 사랑은 온유하며 투기하는 자가 되지 아니하며 사랑은 자랑하지 아니하며 교만하지 아니하며"}, {"n": 5, "text": "무례히 행치 아니하며 자기의 유익을 구치 아니하며 성내지 아니하며 악한 것을 생각지 아니하며"}, {"n": 6, "text": "불의를 기뻐하지 아니하며 진리와 함께 기뻐하고"}, {"n": 7, "text": "모든 것을 참으며 모든 것을 믿으며 모든 것을 바라며 모든 것을 견디느니라"}, {"n": 8, "text": "사랑은 언제까지든지 떨어지지 아니하나 예언도 폐하고 방언도 그치고 지식도 폐하리라"}, {"n": 9, "text": "우리가 부분적으로 알고 부분적으로 예언하니"}, {"n": 10, "text": "온전한 것이 올 때에는 부분적으로 하던 것이 폐하리라"}, {"n": 11, "text": "내가 어렸을 때에는 말하는 것이 어린 아이와 같고 깨닫는 것이 어린 아이와 같고 생각하는 것이 어린 아이와 같다가 장성한 사람이 되어서는 어린 아이의 일을 버렸노라"}, {"n": 12, "text": "우리가 이제는 거울로 보는것 같이 희미하나 그 때에는 얼굴과 얼굴을 대하여 볼 것이요 이제는 내가 부분적으로 아나 그 때에는 주께서 나를 아신 것 같이 내가 온전히 알리라"}, {"n": 13, "text": "그런즉 믿음, 소망, 사랑, 이 세 가지는 항상 있을 것인데 그 중에 제일은 사랑이라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200001000, "folderId": 1788947115563, "title": "내일 일을 염려하지 말라", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 6장", "lines": [{"n": 25, "text": "그러므로 내가 너희에게 이르노니 목숨을 위하여 무엇을 먹을까 무엇을 마실까 몸을 위하여 무엇을 입을까 염려하지 말라 목숨이 음식보다 중하지 아니하며 몸이 의복보다 중하지 아니하냐"}, {"n": 26, "text": "공중의 새를 보라 심지도 않고 거두지도 않고 창고에 모아 들이지도 아니하되 너희 천부께서 기르시나니 너희는 이것들보다 귀하지 아니하냐"}, {"n": 27, "text": "너희 중에 누가 염려함으로 그 키를 한 자나 더할 수 있느냐"}, {"n": 28, "text": "또 너희가 어찌 의복을 위하여 염려하느냐 들의 백합화가 어떻게 자라는가 생각하여 보라 수고도 아니하고 길쌈도 아니하느니라"}, {"n": 29, "text": "그러나 내가 너희에게 말하노니 솔로몬의 모든 영광으로도 입은 것이 이 꽃 하나만 같지 못하였느니라"}, {"n": 30, "text": "오늘 있다가 내일 아궁이에 던지우는 들풀도 하나님이 이렇게 입히시거든 하물며 너희일까보냐 믿음이 적은 자들아"}, {"n": 31, "text": "그러므로 염려하여 이르기를 무엇을 먹을까 무엇을 마실까 무엇을 입을까 하지 말라"}, {"n": 32, "text": "이는 다 이방인들이 구하는 것이라 너희 천부께서 이 모든 것이 너희에게 있어야 할 줄을 아시느니라"}, {"n": 33, "text": "너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라"}, {"n": 34, "text": "그러므로 내일 일을 위하여 염려하지 말라 내일 일은 내일 염려할 것이요 한 날 괴로움은 그 날에 족하니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200002000, "folderId": 1788947115563, "title": "하나님이 세상을 이처럼 사랑하사", "kind": "bible", "blocks": [{"t": "verse", "ref": "요한복음 3장", "lines": [{"n": 14, "text": "모세가 광야에서 뱀을 든것 같이 인자도 들려야 하리니"}, {"n": 15, "text": "이는 저를 믿는 자마다 영생을 얻게 하려 하심이니라"}, {"n": 16, "text": "하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라"}, {"n": 17, "text": "하나님이 그 아들을 세상에 보내신 것은 세상을 심판하려 하심이 아니요 저로 말미암아 세상이 구원을 받게하려 하심이라"}, {"n": 18, "text": "저를 믿는 자는 심판을 받지 아니하는 것이요 믿지 아니하는 자는 하나님의 독생자의 이름을 믿지 아니하므로 벌써 심판을 받은 것이니라"}, {"n": 19, "text": "그 정죄는 이것이니 곧 빛이 세상에 왔으되 사람들이 자기 행위가 악하므로 빛보다 어두움을 더 사랑한 것이니라"}, {"n": 20, "text": "악을 행하는 자마다 빛을 미워하여 빛으로 오지 아니하나니 이는 그 행위가 드러날까 함이요"}, {"n": 21, "text": "진리를 좇는 자는 빛으로 오나니 이는 그 행위가 하나님 안에서 행한 것임을 나타내려 함이라 하시니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200003000, "folderId": 1788947115563, "title": "선으로 악을 이기라", "kind": "bible", "blocks": [{"t": "verse", "ref": "로마서 12장", "lines": [{"n": 9, "text": "사랑엔 거짓이 없나니 악을 미워하고 선에 속하라"}, {"n": 10, "text": "형제를 사랑하여 서로 우애하고 존경하기를 서로 먼저 하며"}, {"n": 11, "text": "부지런하여 게으르지 말고 열심을 품고 주를 섬기라"}, {"n": 12, "text": "소망 중에 즐거워하며 환난 중에 참으며 기도에 항상 힘쓰며"}, {"n": 13, "text": "성도들의 쓸 것을 공급하며 손 대접하기를 힘쓰라"}, {"n": 14, "text": "너희를 핍박하는 자를 축복하라 축복하고 저주하지 말라"}, {"n": 15, "text": "즐거워하는 자들로 함께 즐거워하고 우는 자들로 함께 울라"}, {"n": 16, "text": "서로 마음을 같이 하며 높은데 마음을 두지 말고 도리어 낮은데 처하며 스스로 지혜 있는체 말라"}, {"n": 17, "text": "아무에게도 악으로 악을 갚지 말고 모든 사람 앞에서 선한 일을 도모하라"}, {"n": 18, "text": "할 수 있거든 너희로서는 모든 사람으로 더불어 평화하라"}, {"n": 19, "text": "내 사랑하는 자들아 너희가 친히 원수를 갚지 말고 진노하심에 맡기라 기록되었으되 원수 갚는 것이 내게 있으니 내가 갚으리라고 주께서 말씀하시니라"}, {"n": 20, "text": "네 원수가 주리거든 먹이고 목마르거든 마시우라 그리함으로 네가 숯불을 그 머리에 쌓아 놓으리라"}, {"n": 21, "text": "악에게 지지 말고 선으로 악을 이기라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200004000, "folderId": 1788947115563, "title": "믿음은 바라는 것들의 실상", "kind": "bible", "blocks": [{"t": "verse", "ref": "히브리서 11장", "lines": [{"n": 1, "text": "믿음은 바라는 것들의 실상이요 보지 못하는 것들의 증거니"}, {"n": 2, "text": "선진들이 이로써 증거를 얻었느니라"}, {"n": 3, "text": "믿음으로 모든 세계가 하나님의 말씀으로 지어진 줄을 우리가 아나니 보이는 것은 나타난 것으로 말미암아 된것이 아니니라"}, {"n": 4, "text": "믿음으로 아벨은 가인보다 더 나은 제사를 하나님께 드림으로 의로운 자라 하시는 증거를 얻었으니 하나님이 그 예물에 대하여 증거하심이라 저가 죽었으나 그 믿음으로써 오히려 말하느니라"}, {"n": 5, "text": "믿음으로 에녹은 죽음을 보지 않고 옮기웠으니 하나님이 저를 옮기심으로 다시 보이지 아니하니라 저는 옮기우기 전에 하나님을 기쁘시게 하는 자라 하는 증거를 받았느니라"}, {"n": 6, "text": "믿음이 없이는 기쁘시게 못하나니 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할찌니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200005000, "folderId": 1788947115563, "title": "하나님은 사랑이시라", "kind": "bible", "blocks": [{"t": "verse", "ref": "요한일서 4장", "lines": [{"n": 7, "text": "사랑하는 자들아 우리가 서로 사랑하자 사랑은 하나님께 속한것이니 사랑하는 자마다 하나님께로 나서 하나님을 알고"}, {"n": 8, "text": "사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라"}, {"n": 9, "text": "하나님의 사랑이 우리에게 이렇게 나타난바 되었으니 하나님이 자기의 독생자를 세상에 보내심은 저로 말미암아 우리를 살리려 하심이니라"}, {"n": 10, "text": "사랑은 여기 있으니 우리가 하나님을 사랑한 것이 아니요 오직 하나님이 우리를 사랑하사 우리 죄를 위하여 화목제로 그 아들을 보내셨음이니라"}, {"n": 11, "text": "사랑하는 자들아 하나님이 이같이 우리를 사랑하셨은즉 우리도 서로 사랑하는 것이 마땅하도다"}, {"n": 12, "text": "어느 때나 하나님을 본 사람이 없으되 만일 우리가 서로 사랑하면 하나님이 우리 안에 거하시고 그의 사랑이 우리 안에 온전히 이루느니라"}, {"n": 13, "text": "그의 성령을 우리에게 주시므로 우리가 그 안에 거하고 그가 우리 안에 거하시는 줄을 아느니라"}, {"n": 14, "text": "아버지가 아들을 세상의 구주로 보내신 것을 우리가 보았고 또 증거하노니"}, {"n": 15, "text": "누구든지 예수를 하나님의 아들이라 시인하면 하나님이 저 안에 거하시고 저도 하나님 안에 거하느니라"}, {"n": 16, "text": "하나님이 우리를 사랑하시는 사랑을 우리가 알고 믿었노니 하나님은 사랑이시라 사랑 안에 거하는 자는 하나님 안에 거하고 하나님도 그 안에 거하시느니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200006000, "folderId": 1788947115563, "title": "나를 아시나이다", "kind": "bible", "blocks": [{"t": "verse", "ref": "시편 139편", "lines": [{"n": 1, "text": "여호와여 주께서 나를 감찰하시고 아셨나이다"}, {"n": 2, "text": "주께서 나의 앉고 일어섬을 아시며 멀리서도 나의 생각을 통촉하시오며"}, {"n": 3, "text": "나의 길과 눕는 것을 감찰하시며 나의 모든 행위를 익히 아시오니"}, {"n": 4, "text": "여호와여 내 혀의 말을 알지 못하시는 것이 하나도 없으시니이다"}, {"n": 5, "text": "주께서 나의 전후를 두르시며 내게 안수하셨나이다"}, {"n": 6, "text": "이 지식이 내게 너무 기이하니 높아서 내가 능히 미치지 못하나이다"}, {"n": 7, "text": "내가 주의 신을 떠나 어디로 가며 주의 앞에서 어디로 피하리이까"}, {"n": 8, "text": "내가 하늘에 올라갈찌라도 거기 계시며 음부에 내 자리를 펼찌라도 거기 계시니이다"}, {"n": 9, "text": "내가 새벽 날개를 치며 바다 끝에 가서 거할찌라도"}, {"n": 10, "text": "곧 거기서도 주의 손이 나를 인도하시며 주의 오른손이 나를 붙드시리이다"}, {"n": 11, "text": "내가 혹시 말하기를 흑암이 정녕 나를 덮고 나를 두른 빛은 밤이 되리라 할찌라도"}, {"n": 12, "text": "주에게서는 흑암이 숨기지 못하며 밤이 낮과 같이 비취나니 주에게는 흑암과 빛이 일반이니이다"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200007000, "folderId": 1788947115563, "title": "여호와를 앙망하는 자는 새 힘을 얻으리니", "kind": "bible", "blocks": [{"t": "verse", "ref": "이사야 40장", "lines": [{"n": 25, "text": "거룩하신 자가 가라사대 그런즉 너희가 나를 누구에게 비기며 나로 그와 동등이 되게 하겠느냐 하시느니라"}, {"n": 26, "text": "너희는 눈을 높이 들어 누가 이 모든 것을 창조하였나 보라 주께서는 수효대로 만상을 이끌어 내시고 각각 그 이름을 부르시나니 그의 권세가 크고 그의 능력이 강하므로 하나도 빠짐이 없느니라"}, {"n": 27, "text": "야곱아 네가 어찌하여 말하며 이스라엘아 네가 어찌하여 이르기를 내 사정은 여호와께 숨겨졌으며 원통한 것은 내 하나님에게서 수리하심을 받지 못한다 하느냐"}, {"n": 28, "text": "너는 알지 못하였느냐 듣지 못하였느냐 영원하신 하나님 여호와, 땅 끝까지 창조하신 자는 피곤치 아니하시며 곤비치 아니하시며 명철이 한이 없으시며"}, {"n": 29, "text": "피곤한 자에게는 능력을 주시며 무능한 자에게는 힘을 더하시나니"}, {"n": 30, "text": "소년이라도 피곤하며 곤비하며 장정이라도 넘어지며 자빠지되"}, {"n": 31, "text": "오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리의 날개치며 올라감 같을 것이요 달음박질하여도 곤비치 아니하겠고 걸어가도 피곤치 아니하리로다"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200008000, "folderId": 1788947115563, "title": "너희는 내게로 돌아오라", "kind": "bible", "blocks": [{"t": "verse", "ref": "스가랴 1장", "lines": [{"n": 2, "text": "나 여호와가 무리의 열조에게 심히 진노하였느니라"}, {"n": 3, "text": "그러므로 너는 무리에게 고하기를 만군의 여호와께서 이처럼 이르시되 너희는 내게로 돌아오라 나 만군의 여호와의 말이니라 그리하면 내가 너희에게로 돌아가리라 나 만군의 여호와의 말이니라"}, {"n": 4, "text": "너희 열조를 본받지 말라 옛적 선지자들이 그들에게 외쳐 가로되 만군의 여호와께서 말씀하시기를 너희가 악한 길, 악한 행실을 떠나서 돌아오라 하셨다 하나 그들이 듣지 않고 내게 귀를 기울이지 아니하였느니라 나 여호와의 말이니라"}, {"n": 5, "text": "너희 열조가 어디 있느냐 선지자들이 영원히 살겠느냐"}, {"n": 6, "text": "내가 종 선지자들에게 명한 내 말과 내 전례들이 어찌 네 열조에게 임하지 아니하였느냐 그러므로 그들이 돌쳐 이르기를 만군의 여호와께서 우리 길대로, 우리 행위대로 우리에게 행하시려고 뜻하신 것을 우리에게 행하셨도다 하였다 하셨느니라 하라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200009000, "folderId": 1788947115563, "title": "두 사람이 한 사람보다 나음은", "kind": "bible", "blocks": [{"t": "verse", "ref": "전도서 4장", "lines": [{"n": 9, "text": "두 사람이 한 사람보다 나음은 저희가 수고함으로 좋은 상을 얻을 것임이라"}, {"n": 10, "text": "혹시 저희가 넘어지면 하나가 그 동무를 붙들어 일으키려니와 홀로 있어 넘어지고 붙들어 일으킬 자가 없는 자에게는 화가 있으리라"}, {"n": 11, "text": "두 사람이 함께 누우면 따뜻하거니와 한 사람이면 어찌 따뜻하랴"}, {"n": 12, "text": "한 사람이면 패하겠거니와 두 사람이면 능히 당하나니 삼겹 줄은 쉽게 끊어지지 아니하느니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200010000, "folderId": 1788947115563, "title": "구하라 찾으라 두드리라", "kind": "bible", "blocks": [{"t": "verse", "ref": "누가복음 11장", "lines": [{"n": 9, "text": "내가 또 너희에게 이르노니 구하라 그러면 너희에게 주실 것이요 찾으라 그러면 찾을 것이요 문을 두드리라 그러면 너희에게 열릴 것이니"}, {"n": 10, "text": "구하는 이마다 받을 것이요 찾는 이가 찾을 것이요 두드리는 이에게 열릴 것이니라"}, {"n": 11, "text": "너희 중에 아비된 자 누가 아들이 생선을 달라 하면 생선 대신에 뱀을 주며"}, {"n": 12, "text": "알을 달라 하면 전갈을 주겠느냐"}, {"n": 13, "text": "너희가 악할찌라도 좋은 것을 자식에게 줄줄 알거든 하물며 너희 천부께서 구하는 자에게 성령을 주시지 않겠느냐 하시니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200011000, "folderId": 1788947115563, "title": "강하고 담대하라", "kind": "bible", "blocks": [{"t": "verse", "ref": "여호수아 1장", "lines": [{"n": 5, "text": "너의 평생에 너를 능히 당할 자 없으리니 내가 모세와 함께 있던것 같이 너와 함께 있을 것임이라 내가 너를 떠나지 아니하며 버리지 아니하리니"}, {"n": 6, "text": "마음을 강하게 하라 담대히 하라 너는 이 백성으로 내가 그 조상에게 맹세하여 주리라 한 땅을 얻게 하리라"}, {"n": 7, "text": "오직 너는 마음을 강하게 하고 극히 담대히 하여 나의 종 모세가 네게 명한 율법을 다 지켜 행하고 좌로나 우로나 치우치지 말라 그리하면 어디로 가든지 형통하리니"}, {"n": 8, "text": "이 율법책을 네 입에서 떠나지 말게 하며 주야로 그것을 묵상하여 그 가운데 기록한대로 다 지켜 행하라 그리하면 네 길이 평탄하게 될 것이라 네가 형통하리라"}, {"n": 9, "text": "내가 네게 명한 것이 아니냐 마음을 강하게 하고 담대히 하라 두려워 말며 놀라지 말라 네가 어디로 가든지 네 하나님 여호와가 너와 함께 하느니라 하시니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790200012000, "folderId": 1788947115563, "title": "여호와께 감사하라 그는 선하시며", "kind": "bible", "blocks": [{"t": "verse", "ref": "시편 107편", "lines": [{"n": 1, "text": "여호와께 감사하라 그는 선하시며 그 인자하심이 영원함이로다"}, {"n": 2, "text": "여호와께 구속함을 받은 자는 이 같이 말할찌어다 여호와께서 대적의 손에서 저희를 구속하사"}, {"n": 3, "text": "동서 남북 각 지방에서부터 모으셨도다"}, {"n": 4, "text": "저희가 광야 사막 길에서 방황하며 거할 성을 찾지 못하고"}, {"n": 5, "text": "주리고 목마름으로 그 영혼이 속에서 피곤하였도다"}, {"n": 6, "text": "이에 저희가 그 근심 중에 여호와께 부르짖으매 그 고통에서 건지시고"}, {"n": 7, "text": "또 바른 길로 인도하사 거할 성에 이르게 하셨도다"}, {"n": 8, "text": "여호와의 인자하심과 인생에게 행하신 기이한 일을 인하여 그를 찬송할찌로다"}, {"n": 9, "text": "저가 사모하는 영혼을 만족케 하시며 주린 영혼에게 좋은 것으로 채워주심이로다"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790717307525, "folderId": 1, "title": "천지창조", "kind": "bible", "blocks": [{"t": "verse", "ref": "창세기 1장", "lines": [{"h": "창세기 1:1-31", "ref": "창세기 1장"}, {"n": 1, "text": "태초에 하나님이 천지를 창조하시니라"}, {"n": 2, "text": "땅이 혼돈하고 공허하며 흑암이 깊음 위에 있고 하나님의 신은 수면에 운행하시니라"}, {"n": 3, "text": "하나님이 가라사대 빛이 있으라 하시매 빛이 있었고"}, {"n": 4, "text": "그 빛이 하나님의 보시기에 좋았더라 하나님이 빛과 어두움을 나누사"}, {"n": 5, "text": "빛을 낮이라 칭하시고 어두움을 밤이라 칭하시니라 저녁이 되며 아침이 되니 이는 첫째 날이니라"}, {"n": 6, "text": "하나님이 가라사대 물 가운데 궁창이 있어 물과 물로 나뉘게 하리라 하시고"}, {"n": 7, "text": "하나님이 궁창을 만드사 궁창 아래의 물과 궁창 위의 물로 나뉘게 하시매 그대로 되니라"}, {"n": 8, "text": "하나님이 궁창을 하늘이라 칭하시니라 저녁이 되며 아침이 되니 이는 둘째 날이니라"}, {"n": 9, "text": "하나님이 가라사대 천하의 물이 한곳으로 모이고 뭍이 드러나라 하시매 그대로 되니라"}, {"n": 10, "text": "하나님이 뭍을 땅이라 칭하시고 모인 물을 바다라 칭하시니라 하나님의 보시기에 좋았더라"}, {"n": 11, "text": "하나님이 가라사대 땅은 풀과 씨 맺는 채소와 각기 종류대로 씨 가진 열매 맺는 과목을 내라 하시매 그대로 되어"}, {"n": 12, "text": "땅이 풀과 각기 종류대로 씨 맺는 채소와 각기 종류대로 씨 가진 열매 맺는 나무를 내니 하나님의 보시기에 좋았더라"}, {"n": 13, "text": "저녁이 되며 아침이 되니 이는 세째 날이니라"}, {"n": 14, "text": "하나님이 가라사대 하늘의 궁창에 광명이 있어 주야를 나뉘게 하라 또 그 광명으로 하여 징조와 사시와 일자와 연한이 이루라"}, {"n": 15, "text": "또 그 광명이 하늘의 궁창에 있어 땅에 비취라 하시고 (그대로 되니라)"}, {"n": 16, "text": "하나님이 두 큰 광명을 만드사 큰 광명으로 낮을 주관하게 하시고 작은 광명으로 밤을 주관하게 하시며 또 별들을 만드시고"}, {"n": 17, "text": "하나님이 그것들을 하늘의 궁창에 두어 땅에 비취게 하시며"}, {"n": 18, "text": "주야를 주관하게 하시며 빛과 어두움을 나뉘게 하시니라 하나님의 보시기에 좋았더라"}, {"n": 19, "text": "저녁이 되며 아침이 되니 이는 네째 날이니라"}, {"n": 20, "text": "하나님이 가라사대 물들은 생물로 번성케 하라 땅위 하늘의 궁창에는 새가 날으라 하시고"}, {"n": 21, "text": "하나님이 큰 물고기와 물에서 번성하여 움직이는 모든 생물을 그 종류대로, 날개 있는 모든 새를 그 종류대로 창조하시니 하나님의 보시기에 좋았더라"}, {"n": 22, "text": "하나님이 그들에게 복을 주어 가라사대 생육하고 번성하여 여러 바다 물에 충만하라 새들도 땅에 번성하라 하시니라"}, {"n": 23, "text": "저녁이 되며 아침이 되니 이는 다섯째 날이니라"}, {"n": 24, "text": "하나님이 가라사대 땅은 생물을 그 종류대로 내되 육축과 기는 것과 땅의 짐승을 종류대로 내라 하시고 (그대로 되니라)"}, {"n": 25, "text": "하나님이 땅의 짐승을 그 종류대로, 육축을 그 종류대로, 땅에 기는 모든 것을 그 종류대로 만드시니 하나님의 보시기에 좋았더라"}, {"n": 26, "text": "하나님이 가라사대 우리의 형상을 따라 우리의 모양대로 우리가 사람을 만들고 그로 바다의 고기와 공중의 새와 육축과 온 땅과 땅에 기는 모든 것을 다스리게 하자 하시고"}, {"n": 27, "text": "하나님이 자기 형상 곧 하나님의 형상대로 사람을 창조하시되 남자와 여자를 창조하시고"}, {"n": 28, "text": "하나님이 그들에게 복을 주시며 그들에게 이르시되 생육하고 번성하여 땅에 충만하라, 땅을 정복하라, 바다의 고기와 공중의 새와 땅에 움직이는 모든 생물을 다스리라 하시니라"}, {"n": 29, "text": "하나님이 가라사대 내가 온 지면의 씨 맺는 모든 채소와 씨 가진 열매 맺는 모든 나무를 너희에게 주노니 너희 식물이 되리라"}, {"n": 30, "text": "또 땅의 모든 짐승과 공중의 모든 새와 생명이 있어 땅에 기는 모든 것에게는 내가 모든 푸른 풀을 식물로 주노라 하시니 그대로 되니라"}, {"n": 31, "text": "하나님이 그 지으신 모든 것을 보시니 보시기에 심히 좋았더라 저녁이 되며 아침이 되니 이는 여섯째 날이니라"}, {"h": "창세기 2:1-3", "ref": "창세기 2장"}, {"n": 1, "text": "천지와 만물이 다 이루니라"}, {"n": 2, "text": "하나님의 지으시던 일이 일곱째 날이 이를 때에 마치니 그 지으시던 일이 다하므로 일곱째 날에 안식하시니라"}, {"n": 3, "text": "하나님이 일곱째 날을 복 주사 거룩하게 하셨으니 이는 하나님이 그 창조하시며 만드시던 모든 일을 마치시고 이 날에 안식하셨음이더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고 묵상해보세요."}], "sample": true}, {"id": 1790717431251, "folderId": 1, "title": "사람을 지으신 하나님", "kind": "bible", "blocks": [{"t": "verse", "lines": [{"h": "창세기 2:7-9"}, {"n": 7, "text": "여호와 하나님이 흙으로 사람을 지으시고 생기를 그 코에 불어 넣으시니 사람이 생령이 된지라"}, {"n": 8, "text": "여호와 하나님이 동방의 에덴에 동산을 창설하시고 그 지으신 사람을 거기 두시고"}, {"n": 9, "text": "여호와 하나님이 그 땅에서 보기에 아름답고 먹기에 좋은 나무가 나게 하시니 동산 가운데에는 생명나무와 선악을 알게하는 나무도 있더라"}, {"h": "창세기 2:15-19"}, {"n": 15, "text": "여호와 하나님이 그 사람을 이끌어 에덴 동산에 두사 그것을 다스리며 지키게 하시고"}, {"n": 16, "text": "여호와 하나님이 그 사람에게 명하여 가라사대 동산 각종 나무의 실과는 네가 임의로 먹되"}, {"n": 17, "text": "선악을 알게하는 나무의 실과는 먹지 말라 네가 먹는 날에는 정녕 죽으리라 하시니라"}, {"n": 18, "text": "여호와 하나님이 가라사대 사람의 독처하는 것이 좋지 못하니 내가 그를 위하여 돕는 배필을 지으리라 하시니라"}, {"n": 19, "text": "여호와 하나님이 흙으로 각종 들짐승과 공중의 각종 새를 지으시고 아담이 어떻게 이름을 짓나 보시려고 그것들을 그에게로 이끌어 이르시니 아담이 각 생물을 일컫는 바가 곧 그 이름이라"}, {"h": "창세기 2:21-25", "ref": "창세기 2장"}, {"n": 21, "text": "여호와 하나님이 아담을 깊이 잠들게 하시니 잠들매 그가 그 갈빗대 하나를 취하고 살로 대신 채우시고"}, {"n": 22, "text": "여호와 하나님이 아담에게서 취하신 그 갈빗대로 여자를 만드시고 그를 아담에게로 이끌어 오시니"}, {"n": 23, "text": "아담이 가로되 이는 내 뼈 중의 뼈요 살 중의 살이라 이것을 남자에게서 취하였은즉 여자라 칭하리라 하니라"}, {"n": 24, "text": "이러므로 남자가 부모를 떠나 그 아내와 연합하여 둘이 한 몸을 이룰찌로다"}, {"n": 25, "text": "아담과 그 아내 두 사람이 벌거벗었으나 부끄러워 아니하니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고 묵상해보세요."}], "sample": true}, {"id": 1790717995798, "folderId": 1, "title": "아담과 하와, 첫번째 죄", "kind": "bible", "blocks": [{"t": "verse", "ref": "창세기 3장", "lines": [{"n": 1, "text": "여호와 하나님의 지으신 들짐승 중에 뱀이 가장 간교하더라 뱀이 여자에게 물어 가로되 하나님이 참으로 너희더러 동산 모든 나무의 실과를 먹지 말라 하시더냐"}, {"n": 2, "text": "여자가 뱀에게 말하되 동산 나무의 실과를 우리가 먹을 수 있으나"}, {"n": 3, "text": "동산 중앙에 있는 나무의 실과는 하나님의 말씀에 너희는 먹지도 말고 만지지도 말라 너희가 죽을까 하노라 하셨느니라"}, {"n": 4, "text": "뱀이 여자에게 이르되 너희가 결코 죽지 아니하리라"}, {"n": 5, "text": "너희가 그것을 먹는 날에는 너희 눈이 밝아 하나님과 같이 되어 선악을 알줄을 하나님이 아심이니라"}, {"n": 6, "text": "여자가 그 나무를 본즉 먹음직도 하고 보암직도 하고 지혜롭게 할만큼 탐스럽기도 한 나무인지라 여자가 그 실과를 따먹고 자기와 함께한 남편에게도 주매 그도 먹은지라"}, {"n": 7, "text": "이에 그들의 눈이 밝아 자기들의 몸이 벗은 줄을 알고 무화과나무 잎을 엮어 치마를 하였더라"}, {"n": 8, "text": "그들이 날이 서늘할 때에 동산에 거니시는 여호와 하나님의 음성을 듣고 아담과 그 아내가 여호와 하나님의 낯을 피하여 동산 나무 사이에 숨은지라"}, {"n": 9, "text": "여호와 하나님이 아담을 부르시며 그에게 이르시되 네가 어디 있느냐"}, {"n": 10, "text": "가로되 내가 동산에서 하나님의 소리를 듣고 내가 벗었으므로 두려워하여 숨었나이다"}, {"n": 11, "text": "가라사대 누가 너의 벗었음을 네게 고하였느냐 내가 너더러 먹지 말라 명한 그 나무 실과를 네가 먹었느냐"}, {"n": 12, "text": "아담이 가로되 하나님이 주셔서 나와 함께하게 하신 여자 그가 그 나무 실과를 내게 주므로 내가 먹었나이다"}, {"n": 13, "text": "여호와 하나님이 여자에게 이르시되 네가 어찌하여 이렇게 하였느냐 여자가 가로되 뱀이 나를 꾀므로 내가 먹었나이다"}, {"n": 14, "text": "여호와 하나님이 뱀에게 이르시되 네가 이렇게 하였으니 네가 모든 육축과 들의 모든 짐승보다 더욱 저주를 받아 배로 다니고 종신토록 흙을 먹을지니라"}, {"n": 15, "text": "내가 너로 여자와 원수가 되게하고 너의 후손도 여자의 후손과 원수가 되게 하리니 여자의 후손은 네 머리를 상하게 할 것이요 너는 그의 발꿈치를 상하게 할 것이니라 하시고"}, {"n": 16, "text": "또 여자에게 이르시되 내가 네게 잉태하는 고통을 크게 더하리니 네가 수고하고 자식을 낳을 것이며 너는 남편을 사모하고 남편은 너를 다스릴 것이니라 하시고"}, {"n": 17, "text": "아담에게 이르시되 네가 네 아내의 말을 듣고 내가 너더러 먹지 말라한 나무 실과를 먹었은즉 땅은 너로 인하여 저주를 받고 너는 종신토록 수고하여야 그 소산을 먹으리라"}, {"n": 18, "text": "땅이 네게 가시덤불과 엉겅퀴를 낼 것이라 너의 먹을 것은 밭의 채소인즉"}, {"n": 19, "text": "네가 얼굴에 땀이 흘러야 식물을 먹고 필경은 흙으로 돌아 가리니 그 속에서 네가 취함을 입었음이라 너는 흙이니 흙으로 돌아갈 것이니라 하시니라"}, {"n": 20, "text": "아담이 그 아내를 하와라 이름하였으니 그는 모든 산 자의 어미가 됨이더라"}, {"n": 21, "text": "여호와 하나님이 아담과 그 아내를 위하여 가죽옷을 지어 입히시니라"}, {"n": 22, "text": "여호와 하나님이 가라사대 보라 이 사람이 선악을 아는 일에 우리 중 하나 같이 되었으니 그가 그 손을 들어 생명나무 실과도 따먹고 영생할까 하노라 하시고"}, {"n": 23, "text": "여호와 하나님이 에덴동산에서 그 사람을 내어 보내어 그의 근본된 토지를 갈게 하시니라"}, {"n": 24, "text": "이같이 하나님이 그 사람을 쫓아 내시고 에덴동산 동편에 그룹들과 두루 도는 화염검을 두어 생명나무의 길을 지키게 하시니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고 묵상해보세요."}], "sample": true}, {"id": 1790719732511, "folderId": 1, "title": "노아의 방주", "kind": "bible", "blocks": [{"t": "verse", "lines": [{"h": "창세기 6:9-16", "ref": "창세기 6장"}, {"n": 9, "text": "노아의 사적은 이러하니라 노아는 의인이요 당세에 완전한 자라 그가 하나님과 동행하였으며"}, {"n": 10, "text": "그가 세 아들을 낳았으니 셈과 함과 야벳이라"}, {"n": 11, "text": "때에 온 땅이 하나님 앞에 패괴하여 강포가 땅에 충만한지라"}, {"n": 12, "text": "하나님이 보신즉 땅이 패괴하였으니 이는 땅에서 모든 혈육 있는 자의 행위가 패괴함이었더라"}, {"n": 13, "text": "하나님이 노아에게 이르시되 모든 혈육 있는 자의 강포가 땅에 가득하므로 그 끝날이 내 앞에 이르렀으니 내가 그들을 땅과 함께 멸하리라"}, {"n": 14, "text": "너는 잣나무로 너를 위하여 방주를 짓되 그 안에 간들을 막고 역청으로 그 안팎에 칠하라"}, {"n": 15, "text": "그 방주의 제도는 이러하니 장이 삼백 규빗, 광이 오십 규빗, 고가 삼십 규빗이며"}, {"n": 16, "text": "거기 창을 내되 위에서부터 한 규빗에 내고 그 문은 옆으로 내고 상 중 하 삼층으로 할찌니라"}, {"h": "창세기 7:1-12", "ref": "창세기 7장"}, {"n": 1, "text": "여호와께서 노아에게 이르시되 너와 네 온 집은 방주로 들어가라 네가 이 세대에 내 앞에서 의로움을 내가 보았음이니라"}, {"n": 2, "text": "너는 모든 정결한 짐승은 암 수 일곱씩, 부정한 것은 암 수 둘씩을 네게로 취하며"}, {"n": 3, "text": "공중의 새도 암 수 일곱씩을 취하여 그 씨를 온 지면에 유전케 하라"}, {"n": 4, "text": "지금부터 칠일이면 내가 사십 주야를 땅에 비를 내려 나의 지은 모든 생물을 지면에서 쓸어 버리리라"}, {"n": 5, "text": "노아가 여호와께서 자기에게 명하신대로 다 준행하였더라"}, {"n": 6, "text": "홍수가 땅에 있을 때에 노아가 육백세라"}, {"n": 7, "text": "노아가 아들들과 아내와 자부들과 함께 홍수를 피하여 방주에 들어갔고"}, {"n": 8, "text": "정결한 짐승과 부정한 짐승과 새와 땅에 기는 모든 것이"}, {"n": 9, "text": "하나님이 노아에게 명하신대로 암 수 둘씩 노아에게 나아와 방주로 들어갔더니"}, {"n": 10, "text": "칠일 후에 홍수가 땅에 덮이니"}, {"n": 11, "text": "노아 육백세 되던 해 이월 곧 그 달 십칠일이라 그 날에 큰 깊음의 샘들이 터지며 하늘의 창들이 열려"}, {"n": 12, "text": "사십 주야를 비가 땅에 쏟아졌더라"}], "ref": "창세기 6장"}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고 묵상해보세요."}], "sample": true}, {"id": 1790333545400, "folderId": 1790300000000, "title": "예수님이 가르쳐주신 기도 (주기도문)", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "마태복음 6:9", "text": "그러므로 너희는 이렇게 기도하라 하늘에 계신 우리 아버지여 이름이 거룩히 여김을 받으시오며"}, {"n": 10, "text": "나라이 임하옵시며 뜻이 하늘에서 이룬 것 같이 땅에서도 이루어지이다"}, {"n": 11, "text": "오늘날 우리에게 일용할 양식을 주옵시고"}, {"n": 12, "text": "우리가 우리에게 죄 지은 자를 사하여 준것 같이 우리 죄를 사하여 주옵시고"}, {"n": 13, "text": "우리를 시험에 들게 하지 마옵시고 다만 악에서 구하옵소서 (나라와 권세와 영광이 아버지께 영원히 있사옵나이다 아멘)"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true, "pinned": 1}]};const IC={"arrows-exchange": "<path d=\"M7 10h14l-4 -4\" /> <path d=\"M17
