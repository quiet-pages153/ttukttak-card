<title>나의 말씀노트</title>
<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1915;--card:#28221D;--line:#3A322A;--tx:#EFE6D8;--sub:#A69784;

  --tile:#2E2520;--dim:rgba(0,0,0,.55);--on-ac:#2A1A12;--danger:#E58A74;color-scheme:dark}}
:root[data-theme="dark"]{

  --ac:#E39A7C;--ac-strong:#F3C9B4;--acb:#402C23;--gr:#A3C08A;--grb:#2B3424;
  --am:#E2B866;--amb:#3A2F1C;--am-tx:#E8C98A;--bl:#9CBFC6;--blb:#25333A;

html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:1.15em;height:1.15em;stroke-width:1.8;vertical-align:-.2em;flex-shrink:0}
#app{max-width:480px;margin:0 auto;height:100%;position:relative;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding:22px 16px 110px;display:flex;flex-direction:column;gap:12px}
.screen.no-nav{padding-bottom:96px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{font-size:13px;color:var(--sub)}
.serif{font-family:var(--serif);font-weight:500}
.h1{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:-.2px;text-wrap:balance}
.h2{font-family:var(--serif);font-weight:700;font-size:19px;text-wrap:balance}
.iconbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--sub);font-size:19px}

.search .star{width:44px;height:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--am);display:flex;align-items:center;justify-content:center;font-size:18px}
.recent{background:var(--acb);border-radius:16px;padding:13px 15px;text-align:left;width:100%}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:98px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:left;position:relative;overflow:hidden}

.bible .en{font-size:11px;letter-spacing:3px;color:var(--ac);font-weight:600}

.list{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 8px}

.lr .grow{flex:1}
.bible-row{position:relative;overflow:hidden;border:2.5px solid var(--ac);background:var(--tile);border-radius:12px;padding:10px 12px;margin-bottom:4px;display:block;width:100%;text-align:left}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}

.topbar{display:flex;align-items:center;gap:6px;margin:-6px -8px 0}

.li{display:flex;align-items:center;gap:8px;padding:13px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li .t{flex:1;font-family:var(--serif);font-weight:500;font-size:16px}
.li .r{font-size:12.5px;color:var(--sub);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:5px 11px;border-radius:999px;white-space:nowrap}
.pa{background:var(--acb);color:var(--ac)}.pgr{background:var(--grb);color:var(--gr)}.po{border:1px solid var(--line);color:var(--sub)}
.mini{padding:2px 8px;font-size:11.5px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--on-ac);border-radius:999px;padding:12px 18px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px;z-index:4;box-shadow:0 6px 18px rgba(90,50,30,.22)}
.scripture{font-family:var(--serif);font-weight:500;font-size:var(--verse);line-height:1.9;word-break:keep-all}
.scripture sup{font-family:var(--sans);font-weight:600;font-size:.58em;color:var(--sub);margin:0 3px 0 2px;vertical-align:.45em}
.scripture .blk{margin:0 0 12px}
.vl{display:flex;gap:8px;padding:3px 0;line-height:1.75}
.vn{font-family:var(--sans);font-weight:600;font-size:.7em;color:var(--ac);min-width:1.7em;text-align:right;padding-top:.5em;font-variant-numeric:tabular-nums;flex-shrink:0}
.scripture .ref{display:block;font-family:var(--sans);font-size:12.5px;color:var(--ac);font-weight:600;margin-bottom:1px}
.clamp{max-height:calc(var(--verse) * 1.85 * 7);overflow:hidden;position:relative}
.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.2em;background:linear-gradient(rgba(0,0,0,0),var(--bg))}
.more{align-self:center;color:var(--sub);font-size:13.5px;display:flex;gap:4px;align-items:center;padding:4px 10px}
.remark{background:var(--amb);color:var(--am-tx);border-radius:12px;padding:11px 13px;font-size:14.5px;line-height:1.6;display:flex;gap:8px;white-space:pre-line}
.m{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:flex-start}
.m .dt{color:var(--ac);font-size:13px;font-weight:600;flex-shrink:0;padding-top:2px;font-variant-numeric:tabular-nums;min-width:36px}
.m .tx{font-family:var(--serif);font-weight:500;font-size:calc(var(--verse) - 1px);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m.open .tx{-webkit-line-clamp:unset;display:block;white-space:pre-line}
.ex{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;font-family:var(--sans);vertical-align:1px}
.tools{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tools .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
.tools button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--sub);min-width:60px;padding:4px 0}
.tools button svg{font-size:22px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;padding:9px 0;border-radius:10px;color:var(--sub);font-size:14px}
.seg button.on{background:var(--acb);color:var(--ac);font-weight:600}
.seg button.on.g{background:var(--grb);color:var(--gr)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .w{font-size:12px;color:var(--sub);padding:4px 0}
.cal button{height:44px;border-radius:12px;font-size:15px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cal button.today{color:var(--ac);font-weight:600}
.cal button.sel{background:var(--acb);color:var(--ac);font-weight:600}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.rec{border-left:2.5px solid var(--ac);padding:3px 0 3px 11px;width:100%;text-align:left}
.rec.g{border-color:var(--gr)}
.rec .k{font-size:12.5px;font-weight:600;color:var(--ac);display:flex;align-items:center;gap:4px}
.rec.g .k{color:var(--gr)}
.rec .b{font-family:var(--serif);font-weight:500;font-size:calc(var(--verse) - 1px);line-height:1.65;white-space:pre-line;margin-top:2px}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:18px 0;line-height:1.7}
.gh{font-size:13px;color:var(--sub);margin-top:6px}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--dim);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease;max-height:88%;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--tx);padding:12px;font-family:var(--serif);font-weight:500;font-size:var(--verse);line-height:1.75;resize:vertical}
input[type=date]{font:inherit;font-size:13px;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.btn{background:var(--ac);color:var(--on-ac);border-radius:14px;padding:14px 0;font-weight:600;font-size:16px;width:100%}
.btn.g{background:var(--gr)}
.btn.ghost{background:transparent;color:var(--danger);font-weight:400;font-size:14px;padding:8px 0}
.err{color:var(--danger);font-size:13px;margin-top:-6px}
.steps{display:flex;gap:6px;align-items:flex-end}
.steps button{flex:1;padding:10px 0;border-radius:12px;color:var(--sub);font-family:var(--serif);font-weight:500}
.steps button.on{background:var(--acb);color:var(--ac)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center;animation:fade .2s ease}
.soon{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--sub);line-height:1.7;padding:40px 10px}
.soon .big{font-size:44px;color:var(--ac)}
.set{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:15px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ov,.sheet,.toast{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

:root{--pu:#7A6A9B;--pub:#ECE8F3}

:root[data-theme="dark"]{--pu:#B9A9DA;--pub:#2E2839}
.lr{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;color:var(--tx)}
.ck{display:flex;align-items:center;gap:8px}

.memo-view{font-family:var(--serif);font-weight:500;font-size:var(--verse);line-height:1.85;white-space:pre-line;word-break:keep-all}

.manual{white-space:pre-line}
.typ{display:flex;gap:12px;align-items:center;padding:13px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);width:100%;text-align:left}

.icgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

select.inp{appearance:auto}

mark{background:var(--amb);color:inherit;border-radius:3px;padding:0 1px}

.f1 .fb{flex:none;max-width:34%;display:flex;align-items:center;gap:3px;height:44px;padding:0 9px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14.5px;color:var(--tx);white-space:nowrap}
.f1 .fb span{overflow:hidden;text-overflow:ellipsis;min-width:0}.f1 .fb svg{color:var(--sub);flex:none}
.f1 .fb.on{background:var(--acb);border-color:transparent;color:var(--ac);font-weight:700}.f1 .fb.on svg{color:var(--ac)}
.rec mark,.mi mark{background:var(--hlb);color:inherit;border-radius:3px;padding:0 1px}
.updbar{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;border-radius:14px;background:var(--acb);color:var(--ac);font-size:14.5px;font-weight:600;flex-shrink:0}
.updbar span{flex:1}.updbar button{background:var(--ac);color:var(--on-ac);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;white-space:nowrap}
.pkl{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}.pkl button{text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15.5px}.pkl button.on{border-color:var(--ac);color:var(--ac);font-weight:700}

/*46 구형폰 보완*/
@supports not (aspect-ratio:1){.colors button{height:36px!important}.icgrid button{height:44px}}
/*48 설치 준비 · 성경 목록 간격*/
.obprep{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center}

.obprep .spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--acb);border-top-color:var(--ac);animation:obspin .9s linear infinite;margin-bottom:4px}
@keyframes obspin{to{transform:rotate(360deg)}}
.bgrid.b3{gap:6px}.bgrid.b3 button{padding:7px 2px}
/*50 성경 화면 위쪽: 개역한글 글씨 · 검색 · 읽던 곳*/
.h1.bhd{margin:0;display:flex;align-items:baseline;gap:8px}.h1.bhd span{font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--sub);letter-spacing:0}
.bsr{display:flex;align-items:center;gap:4px;padding:6px 2px;font-size:15px;font-weight:600;color:var(--tx)}.bsr svg{font-size:20px}
.rdl{display:flex;align-items:center;gap:6px;width:100%;min-height:30px;flex-shrink:0;padding:2px;font-size:14.5px;color:var(--tx);text-align:left}
.rdl .ic{color:var(--ac);font-size:17px;display:flex;flex:none}.rdl .lb{color:var(--sub);font-size:13.5px;flex:none}.rdl b{font-weight:600;color:var(--ac);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rdl .go{margin-left:auto;color:var(--sub);display:flex;flex:none}

/*54 성경 장 머리 줄 고정 (창세기 1장 ▾ 줄이 스크롤해도 위에 남음)*/
.rdv .topbar{position:-webkit-sticky;position:sticky;top:-38px;z-index:6;background:var(--bg);margin:-22px -6px 0;padding:22px 16px 6px;transition:box-shadow .15s}
.rdv .topbar.stuck{box-shadow:0 1px 0 var(--line)}

/*55 장 고르기 창: 다른 책 버튼 · 같은 창에서 책 목록 · 지금 위치 강조(테두리 없음)*/
.chs{display:flex;flex-direction:column;gap:12px;min-height:0}
.chhd{align-items:center;gap:8px}
.chhd .h2{flex:none}
.chhd .sub{flex:1}
.chsw{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;color:var(--ac);border:1px solid var(--ac);border-radius:999px;padding:6px 12px;flex:none}
.chsw svg{width:15px;height:15px}
.chbk{display:flex;align-items:center;gap:2px;font-size:14px;color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.chbk svg{width:18px;height:18px;flex:none}
.chsp{flex:1}
.chbooks{max-height:52vh;overflow-y:auto;padding:2px}
.chbooks button.cur{background:var(--acb);color:var(--ac);border-color:transparent}

/*52 새 홈: 가죽 스티치 성경 칸 · 읽던 곳 · 최근 본 글 · 노트 탭 폴더*/
.home2{--lea1:#5A4334;--lea2:#3F2F26;--lea3:#33261E;--gold:#D9BC86;--gold2:#D8C6AE}
:root[data-pal="blue"] .home2{--lea1:#3E5269;--lea2:#2C3D51;--lea3:#223143}
:root[data-pal="pink"] .home2{--lea1:#6B3E4A;--lea2:#502C37;--lea3:#42232D}
.home2 .hsr{color:var(--tx);margin-right:-6px}.home2 .hsr svg{width:24px;height:24px}
.hln{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:14.5px;color:var(--sub);padding:2px 4px;min-height:34px}
.hln svg{width:17px;height:17px;color:var(--ac);flex:none}
.hln .lb{flex:none}
.hln b{color:var(--tx);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hln .go{margin-left:auto;display:flex;flex:none;padding-left:6px}.hln .go svg{width:16px;height:16px;color:var(--sub);opacity:.7}
.hbible{position:relative;display:flex;align-items:center;width:100%;height:110px;border-radius:18px;padding:0 30px;text-align:left;overflow:hidden;background:var(--lea2);background:radial-gradient(120% 140% at 30% 20%,var(--lea1) 0,var(--lea2) 55%,var(--lea3) 100%);box-shadow:0 8px 18px rgba(58,40,28,.18);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.hbible:active{transform:scale(.99)}
.hbible .st{position:absolute;left:9px;right:9px;top:9px;bottom:9px;border:1.5px dashed rgba(217,188,134,.42);border-radius:11px;pointer-events:none}
.hbt{display:flex;align-items:center;position:relative}
.hbible .ko{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:.06em;color:#EBCF9B;line-height:1.1;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.hbible .dv{width:1px;height:34px;background:rgba(217,188,134,.45);margin:0 16px}
.hbible .sb{display:flex;flex-direction:column}
.hbible .en{font-weight:600;font-size:11.5px;letter-spacing:.22em;color:var(--gold);line-height:1.3}
.hbible .kr{font-size:14px;color:var(--gold2);margin-top:5px;line-height:1.3}
.hcr{position:absolute;right:30px;top:50%;width:18px;height:23px;margin-top:-11.5px;fill:var(--gold);opacity:.9}
:root[data-theme="dark"] .hbible{box-shadow:0 0 0 1px rgba(217,188,134,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hbible{box-shadow:0 0 0 1px rgba(217,188,134,.14)}}
.hsec{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.hsec h2{font-size:17px;font-weight:600;margin:0}
.hsec button{display:flex;align-items:center;gap:3px;font-size:14px;font-weight:600;color:var(--ac);padding:6px 2px}.hsec button svg{width:15px;height:15px}
.htabs{display:flex;flex-direction:column;margin-top:2px}
.htab{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px 30px;margin-top:-16px;box-shadow:0 -4px 12px rgba(80,55,35,.06);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.htab:first-child{margin-top:0}.htab:last-child{padding-bottom:17px}
.htab:before{content:"";position:absolute;left:18px;top:-1px;width:44px;height:4px;border-radius:0 0 4px 4px;background:var(--k);opacity:.75}
.htab .hic{display:flex;color:var(--k);opacity:.85;flex:none}.htab .hic svg{width:22px;height:22px}
.htab .nm{flex:1;font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htab .ct{font-size:14px;color:var(--sub);flex:none}
.hhint{text-align:center;font-size:12px;margin-top:4px}

/*52 내 폴더 제목과 최근 본 글 사이 간격 줄임*/
.hsec+.hln{margin-top:-10px}

/*56 표지교체 마무리*/
/* 가죽 색: 홈 성경 칸과 성경 화면 통독 칸이 같이 씀 */
:root{--lea1:#5A4334;--lea2:#3F2F26;--lea3:#33261E;--gold:#D9BC86;--gold2:#D8C6AE}
:root[data-pal="blue"]{--lea1:#3E5269;--lea2:#2C3D51;--lea3:#223143}
:root[data-pal="pink"]{--lea1:#6B3E4A;--lea2:#502C37;--lea3:#42232D}
/* 홈: HOLY BIBLE·개역한글 두 줄 높이를 "성경" 글씨에 맞춤 */
.hbible .en{line-height:1.2}
.hbible .kr{margin-top:2px;line-height:1.2}
.hbible .dv{height:30px}
/* 성경 화면: "성경 개역한글" 붙이기 */
.bhd{gap:4px}
/* 성경 화면: 통독 칸을 표지와 같은 가죽 + 바느질 */
.tongc{position:relative;background:var(--lea2);background:radial-gradient(120% 140% at 30% 20%,var(--lea1) 0,var(--lea2) 55%,var(--lea3) 100%);color:#EBCF9B}
.tongc:after{content:"";position:absolute;top:6px;right:6px;bottom:6px;left:6px;border:1.2px dashed rgba(217,188,134,.4);border-radius:12px;pointer-events:none}
.tongc .hd{color:#EBCF9B}.tongc .sm,.tongc .dn{color:var(--gold2)}
.tongc .pg{background:rgba(255,255,255,.12)}.tongc .pg i{background:var(--gold)}
.tongc svg{color:var(--gold)}
/* 폴더 화면: 안내 칸에 홈 폴더 카드와 같은 색 탭 */
.notice{position:relative;background:var(--card);border:1px solid var(--line);color:var(--tx);padding-top:13px}
.notice:before{content:"";position:absolute;left:16px;top:-1px;width:44px;height:4px;border-radius:0 0 4px 4px;background:var(--k,var(--ac));opacity:.75}
.notice .ntop>svg:first-child{color:var(--k,var(--ac))}
.bhd{font-size:26px;letter-spacing:.06em}.bhd span{letter-spacing:0}
.tongc .hd .dn{color:var(--gold2)}

/*57 통독: 첫 장 한 줄 · 체크 창 · 묻는 창 · 되돌리기*/
.tfirst2{display:flex;align-items:center;gap:8px;padding:2px 4px;margin:-4px 0;width:100%;text-align:left;flex-shrink:0}
.tfirst2 .lb{font-size:13px;color:var(--sub);flex:none}.tfirst2 b{font-size:16.5px;font-weight:600;color:var(--tx)}
.tfirst2 .go{margin-left:auto;color:var(--ac);font-weight:600;font-size:14px;display:flex;align-items:center;gap:2px;flex:none}.tfirst2 .go svg{width:16px;height:16px}
.tck{display:flex;flex-direction:column;gap:12px;min-height:0}
.cgrid.ck button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.tov{align-items:center;z-index:30}
.tdlg{border-radius:22px;margin:0 16px;width:auto;padding-top:24px;animation:none}
.tdlg .h2{margin:0;font-size:17.5px;word-break:keep-all}
.tdlg .confirm-row{margin-top:8px}.tdlg .cancel{font-weight:600}.tdlg .del{background:var(--ac)}
.twk{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--sub);margin-top:2px;cursor:pointer}
.twk input{width:18px;height:18px;margin:0;accent-color:var(--ac)}
.toast.ut{display:flex;align-items:center;gap:14px;z-index:45;bottom:calc(28px + env(safe-area-inset-bottom,0px))!important;padding:12px 16px;width:calc(100% - 32px);max-width:448px}
.toast.ut span{flex:1}.toast.ut button{color:var(--acb);font-weight:700;font-size:14.5px;flex:none}
.toast.ut{text-align:left}

/*58 장 칸 7개·숫자 크게 (통독 체크·장 고르기 공통) · 첫 장 줄을 읽던 곳과 같은 형식*/
.cgrid{grid-template-columns:repeat(7,1fr);gap:6px}
.cgrid button{height:42px;font-size:17px;border-radius:10px}
.tfirst2{gap:6px;min-height:30px}
.tfirst2 .ic{color:var(--ac);display:flex;flex:none}.tfirst2 .ic svg{width:17px;height:17px}
.tfirst2 b{color:var(--ac)}
.tfirst2 .go{color:var(--sub);font-weight:400}.tfirst2 .go svg{width:16px;height:16px;opacity:.7}
/*59 백업 알림*/
.bkbar{display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px 8px 10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ac)}
.bkbar>svg,.bkbar>.ti{flex:none;font-size:20px}
.bkbar span{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35;word-break:keep-all}
.bkbar b{font-size:14.5px;color:var(--tx);font-weight:600}.bkbar small{font-size:12.5px;color:var(--sub)}
.bkbar .go{flex:none;background:var(--ac);color:var(--on-ac);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;white-space:nowrap}
.bkbar .x{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--sub);border-radius:50%}
.tdlg .tsub{font-size:14px;margin-top:-4px;word-break:keep-all}
.toast{word-break:keep-all}
/*63 하이라이트 색을 테마에 맞춤 (베이지는 그대로) · 64: 어두운 모드 블루·핑크 더 잘 보이게*/
:root[data-pal="blue"]{--hlb:#C8DCEE}
:root[data-pal="pink"]{--hlb:#F8D9E0}
@media (prefers-color-scheme:dark){:root[data-pal="blue"]:not([data-theme="light"]){--hlb:#365A80}:root[data-pal="pink"]:not([data-theme="light"]){--hlb:#5E3044}}
:root[data-pal="blue"][data-theme="dark"]{--hlb:#365A80}
:root[data-pal="pink"][data-theme="dark"]{--hlb:#5E3044}

/* ================= 나의 말씀노트 ================= */
/* 읽는 화면 머리 줄이 움직이지 않게: 화면 위 여백(22px)만큼만 올라가 붙음 */
.rdv .topbar{top:-22px}
.pgbtn{color:var(--sub)}.pgbtn.on{color:var(--ac)}.pgbtn svg{width:23px;height:23px}
/* 폴더 색의 중간 진하기 (테두리용) */
:root{--rdm:rgba(201,71,63,.42);--orm:rgba(224,102,31,.42);--yem:rgba(198,168,17,.5);--gnm:rgba(69,154,74,.42);--bum:rgba(37,137,218,.4);--nvm:rgba(43,46,134,.36);--vim:rgba(138,79,192,.4);--ikm:rgba(91,95,102,.38)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rdm:rgba(240,138,128,.45);--orm:rgba(247,146,79,.45);--yem:rgba(238,216,75,.45);--gnm:rgba(127,203,131,.45);--bum:rgba(108,184,244,.45);--nvm:rgba(154,156,235,.45);--vim:rgba(197,150,238,.45);--ikm:rgba(181,185,192,.45)}}
:root[data-theme="dark"]{--rdm:rgba(240,138,128,.45);--orm:rgba(247,146,79,.45);--yem:rgba(238,216,75,.45);--gnm:rgba(127,203,131,.45);--bum:rgba(108,184,244,.45);--nvm:rgba(154,156,235,.45);--vim:rgba(197,150,238,.45);--ikm:rgba(181,185,192,.45)}
:root{--onk:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--onk:#1D1915}}
:root[data-theme="dark"]{--onk:#1D1915}

.pk-br{position:absolute;right:-16px;top:-14px;width:190px;height:157px;filter:drop-shadow(0 3px 4px rgba(200,120,140,.18))}
.pk-fa{position:absolute;left:0;top:0;width:100%;height:100%}

.sk-pink .hbible .dv{background:rgba(255,255,255,.6)}

/* ---- 읽기표 화면 ---- */
.rpmsg{margin-top:10px;font-size:14px;color:var(--k);font-weight:600;word-break:keep-all}
.rptd{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 16px}
.rptd>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rptd b{font-family:var(--serif);font-size:16.5px}
.rpnote{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--kb);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.55;word-break:keep-all}
.rpnote .pill{background:var(--card);color:var(--k);border:1px solid var(--km);font-size:14px;padding:7px 14px;font-weight:600}
.rpmiss{font-size:13px;color:var(--sub);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;line-height:1.6}
.rpmiss b{color:var(--tx);font-weight:600}
.rplg{display:flex;gap:14px;font-size:12.5px;color:var(--sub);justify-content:center}
.rplg span{display:flex;align-items:center;gap:5px}
.rplg i{width:12px;height:12px;border-radius:4px;border:1.4px solid var(--km);display:inline-block}
.rplg i.on{background:var(--k);border-color:var(--k)}.rplg i.ms{border-style:dashed;background:var(--kb)}.rplg i.td{border:2px solid var(--k)}
.rpgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rpgrid button{height:40px;border-radius:11px;border:1.4px solid var(--km);font-size:14px;background:var(--card);font-variant-numeric:tabular-nums;color:var(--tx)}
.rpgrid button.on{background:var(--k);border-color:var(--k);color:var(--onk);font-weight:600}
.rpgrid button.ms{border-style:dashed;background:var(--kb)}
.rpgrid button.td{border:2px solid var(--k);font-weight:600}
.cgrid.ck[style] button.on{background:var(--k);border-color:var(--k);color:var(--onk)}
/* 만들기·설정 창 */
.rpadd{display:flex;flex-direction:column;gap:0}
.rlb{font-size:13px;color:var(--sub);margin:14px 0 7px}
.rrow{display:flex;gap:8px}
.ropt{flex:1;min-width:0;border:1.4px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;background:var(--bg);display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;cursor:pointer}
.ropt b{font-size:15px;font-weight:600}.ropt span{font-size:12px;color:var(--sub);line-height:1.4;word-break:keep-all}
.ropt.on{border-color:var(--ac);background:var(--acb)}.ropt.on b{color:var(--ac)}
.ropt input[type=date]{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer}
.rstep{display:flex;align-items:center;gap:12px;margin-top:10px}
.rstep button{width:38px;height:38px;border-radius:50%;border:1.4px solid var(--line);font-size:20px;line-height:1;background:var(--bg)}
.rstep b{font-size:18px;color:var(--ac)}
.rpadd .chbooks{max-height:46vh}
/* 300일 통독표 */
.tgwn{display:flex;align-items:center;gap:4px}
.tgwn>button{display:flex;color:var(--sub);padding:10px}.tgwn>button svg{width:22px;height:22px}
.tgwn .c{flex:1;flex-direction:column;align-items:center;gap:2px}.tgwn .c b{font-size:16.5px;color:var(--tx)}.tgwn .c span{font-size:12.5px}
.tgl{display:flex;flex-direction:column;gap:8px}
.tgr{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.tgr.today{border-color:var(--k)}
.tgr .dot{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--km);display:flex;align-items:center;justify-content:center;flex:none;color:var(--onk)}
.tgr.done .dot{background:var(--k);border-color:var(--k)}.tgr .dot .ck{width:14px;height:14px}
.tgr .dd{display:flex;flex-direction:column;align-items:center;width:30px;font-weight:700;font-size:16px;line-height:1.2;flex:none}
.tgr .dd small{font-size:11px;color:var(--sub);font-weight:400}
.tgr .rg{flex:1;font-family:var(--serif);font-size:15px;line-height:1.45;word-break:keep-all}
.tgr .n{font-size:13px;color:var(--sub);flex:none}
.tgr.done .rg{color:var(--sub)}
/* 읽기표로 읽는 중 */
.rdbn{display:flex;align-items:center;gap:8px;font-size:13px;margin:2px 10px 0;padding:8px 12px;border-radius:12px;background:var(--kb);color:var(--tx)}
.rdbn i{width:8px;height:8px;border-radius:50%;background:var(--k);flex:none}
.rdbn span{font-weight:600;flex:none}
.rdbn em{font-style:normal;margin-left:auto;color:var(--sub);display:inline-flex;align-items:center;gap:3px;text-align:right}
.rdbn em .ck{width:12px;height:12px;color:var(--k)}
.rdv .bv .vn{position:relative}
.newmk{position:absolute;left:-15px;top:.15em;color:var(--ac);line-height:0;pointer-events:none;display:block}
.toast.ut.tp{bottom:auto!important;top:calc(64px + env(safe-area-inset-top,0px))}

 "text": "악인은 그 길을, 불의한 자는 그 생각을 버리고 여호와께로 돌아오라 그리하면 그가 긍휼히 여기시리라 우리 하나님께로 나아오라 그가 널리 용서하시리라"}, {"r": "요엘 2:13", "text": "너희는 옷을 찢지 말고 마음을 찢고 너희 하나님 여호와께로 돌아올찌어다 그는 은혜로우시며 자비로우시며 노하기를 더디하시며 인애가 크시사 뜻을 돌이켜 재앙을 내리지 아니하시나니"}, {"r": "마태복음 4:17", "text": "이때부터 예수께서 비로소 전파하여 가라사대 회개하라 천국이 가까왔느니라 하시더라"}, {"r": "마태복음 6:14", "text": "너희가 사람의 과실을 용서하면 너희 천부께서도 너희 과실을 용서하시려니와"}, {"n": 15, "text": "너희가 사람의 과실을 용서하지 아니하면 너희 아버지께서도 너희 과실을 용서하지 아니하시리라"}, {"r": "마태복음 18:21", "text": "그 때에 베드로가 나아와 가로되 주여 형제가 내게 죄를 범하면 몇번이나 용서하여 주리이까 일곱번까지 하오리이까"}, {"n": 22, "text": "예수께서 가라사대 네게 이르노니 일곱번 뿐 아니라 일흔번씩 일곱번이라도 할찌니라"}, {"r": "누가복음 6:37", "text": "비판치 말라 그리하면 너희가 비판을 받지 않을 것이요 정죄하지 말라 그리하면 너희가 정죄를 받지 않을 것이요 용서하라 그리하면 너희가 용서를 받을 것이요"}, {"r": "누가복음 15:7", "text": "내가 너희에게 이르노니 이와 같이 죄인 하나가 회개하면 하늘에서는 회개할 것 없는 의인 아흔 아홉을 인하여 기뻐하는 것보다 더하리라"}, {"r": "사도행전 3:19", "text": "그러므로 너희가 회개하고 돌이켜 너희 죄 없이 함을 받으라 이같이 하면 유쾌하게 되는 날이 주 앞으로부터 이를 것이요"}, {"r": "고린도후서 7:10", "text": "하나님의 뜻대로 하는 근심은 후회할 것이 없는 구원에 이르게 하는 회개를 이루는 것이요 세상 근심은 사망을 이루는 것이니라"}, {"r": "에베소서 4:32", "text": "서로 인자하게 하며 불쌍히 여기며 서로 용서하기를 하나님이 그리스도 안에서 너희를 용서하심과 같이 하라"}, {"r": "골로새서 3:13", "text": "누가 뉘게 혐의가 있거든 서로 용납하여 피차 용서하되 주께서 너희를 용서하신 것과 같이 너희도 그리하고"}, {"r": "요한일서 1:9", "text": "만일 우리가 우리 죄를 자백하면 저는 미쁘시고 의로우사 우리 죄를 사하시며 모든 불의에서 우리를 깨끗케 하실 것이요"}, {"r": "요한일서 3:15", "text": "그 형제를 미워하는 자마다 살인하는 자니 살인하는 자마다 영생이 그 속에 거하지 아니하는 것을 너희가 아는 바라"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545348, "folderId": 1790300000000, "title": "믿음에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "마태복음 17:20", "text": "가라사대 너희 믿음이 적은 연고니라 진실로 너희에게 이르노니 너희가 만일 믿음이 한 겨자씨만큼만 있으면 이 산을 명하여 여기서 저기로 옮기라 하여도 옮길 것이요 또 너희가 못할 것이 없으리라"}, {"r": "마가복음 9:23", "text": "예수께서 이르시되 할 수 있거든이 무슨 말이냐 믿는 자에게는 능치 못할 일이 없느니라 하시니"}, {"r": "요한복음 11:25", "text": "예수께서 가라사대 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고"}, {"n": 26, "text": "무릇 살아서 나를 믿는 자는 영원히 죽지 아니하리니 이것을 네가 믿느냐"}, {"r": "요한복음 20:29", "text": "예수께서 가라사대 너는 나를 본 고로 16", "text": "내가 복음을 부끄러워하지 아니하노니 이 복음은 모든 믿는 자에게 구원을 주시는 하나님의 능력이 됨이라 첫째는 유대인에게요 또한 헬라인에게로다"}, {"r": "로마서 8:1", "text": "그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니"}, {"r": "로마서 10:9", "text": "네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 얻으리니"}, {"r": "고린도후서 4:8", "text": "우리가 사방으로 우겨쌈을 당하여도 싸이지 아니하며 답답한 일을 당하여도 낙심하지 아니하며"}, {"n": 9, "text": "핍박을 받아도 버린바 되지 아니하며 거꾸러뜨림을 당하여도 망하지 아니하고"}, {"r": "디모데전서 2:5", "text": "하나님은 한 분이시요 또 하나님과 사람 사이에 중보도 한 분이시니 곧 사람이신 그리스도 예수라"}, {"r": "디도서 3:5", "text": "우리를 구원하시되 우리의 행한바 의로운 행위로 말미암지 아니하고 오직 그의 긍휼하심을 좇아 중생의 씻음과 성령의 새롭게 하심으로 하셨나니"}, {"r": "요한계시록 3:20", "text": "볼찌어다 내가 문밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그로 더불어 먹고 그는 나로 더불어 먹으리라"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545350, "folderId": 1790300000000, "title": "보혈에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "이사야 53:5", "text": "그가 찔림은 우리의 허물을 인함이요 그가 상함은 우리의 죄악을 인함이라 그가 징계를 받음으로 우리가 평화를 누리고 그가 채찍에 맞음으로 우리가 나음을 입었도다"}, {"r": "마태복음 26:28", "text": "이것은 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리는바 나의 피 곧 언약의 피니라"}, {"r": "로마서 5:9", "text": "그러면 이제 우리가 그 피를 인하여 의롭다 하심을 얻었은즉 더욱 그로 말미암아 진노하심에서 구원을 얻을 것이니"}, {"r": "에베소서 1:7", "text": "우리가 그리스도 안에서 그의 은혜의 풍성함을 따라 그의 피로 말미암아 구속 곧 죄 사함을 받았으니"}, {"r": "골로새서 1:20", "text": "그의 십자가의 피로 화평을 이루사 만물 곧 땅에 있는 것들이나 하늘에 있는 것들을 그로 말미암아 자기와 화목케 되기를 기뻐하심이라"}, {"r": "히브리서 9:14", "text": "하물며 영원하신 성령으로 말미암아 흠 없는 자기를 하나님께 드린 그리스도의 피가 어찌 너희 양심으로 죽은 행실에서 깨끗하게 하고 살아계신 하나님을 섬기게 못하겠느뇨"}, {"r": "베드로전서 1:18", "text": "너희가 알거니와 너희 조상의 유전한 망령된 행실에서 구속된 것은 은이나 금 같이 없어질 것으로 한 것이 아니요"}, {"n": 19, "text": "오직 흠 없고 점 없는 어린양 같은 그리스도의 보배로운 피로 한 것이니라"}, {"r": "베드로전서 2:24", "text": "친히 나무에 달려 그 몸으로 우리 죄를 담당하셨으니 이는 우리로 죄에 대하여 죽고 의에 대하여 살게 하려 하심이라 저가 채찍에 맞음으로 너희는 나음을 얻었나니"}, {"r": "요한일서 1:7", "text": "저가 빛 가운데 계신것 같이 우리도 빛 가운데 행하면 우리가 서로 사귐이 있고 그 아들 예수의 피가 우리를 모든 죄에서 깨끗하게 하실 것이요"}, {"r": "요한계시록 1:5", "text": "또 충성된 증인으로 죽은 자들 가운데서 먼저 나시고 땅의 임금들의 머리가 되신 예수 그리스도로 말미암아 은혜와 평강이 너희에게 있기를 원하노라 우리를 사랑하사 그의 피로 우리 죄에서 우리를 해방하시고"}, {"r": "요한계시록 12:11", "text": "또 여러 형제가 어린 양의 피와 자기의 증거하는 말을 인하여 저를 이기었으니 그들은 죽기까지 자기 생명을 아끼지 아니하였도다"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545351, "folderId": 1790300000000, "title": "예수 그리스도와 부활에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "이사야 53:6", "text": "우리는 다 양 같아서 그릇 행하여 각기 제 길로 갔거늘 여호와께서는 우리 무리의 죄악을 그에게 담당시키셨도다"}, {"r": "마태복음 1:23", "text": "보라 처녀가 잉태하여 아들을 낳을 것이요 그 이름은 임마누엘이라 하리라 하셨으니 이를 번역한즉 하나님이 우리와 함께 계시다 함이라"}, {"r": "마태복음 28:18", "text": "예수께서 나아와 일러 가라사대 하늘과 땅의 모든 권세를 내게 주셨으니"}, {"n": 19, "text": "그러므로 너희는 가서 모든 족속으로 제자를 삼아 아버지와 아들과 성령의 이름으로 세례를 주고"}, {"n": 20, "text": "내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼찌어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라"}, {"r": "요한복음 1:1", "text": "태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라"}, {"r": "요한복음 1:14", "text": "말씀이 육신이 되어 우리 가운데 거하시매 우리가 그 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라"}, {"r": "요한복음 1:29", "text": "이튿날 요한이 예수께서 자기에게 나아오심을 보고 가로되 보라 세상 죄를 지고 가는 하나님의 어린 양이로다"}, {"r": "요한복음 6:40", "text": "내 아버지의 뜻은 아들을 보고 믿는 자마다 영생을 얻는 이것이니 마지막 날에 내가 이를 다시 살리리라 하시니라"}, {"r": "요한복음 10:11", "text": "나는 선한 목자라 선한 목자는 양들을 위하여 목숨을 버리거니와"}, {"r": "요한복음 11:25", "text": "예수께서 가라사대 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고"}, {"n": 26, "text": "무릇 살아서 나를 믿는 자는 영원히 죽지 아니하리니 이것을 네가 믿느냐"}, {"r": "요한복음 14:6", "text": "예수께서 가라사대 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라"}, {"r": "로마서 8:11", "text": "예수를 죽은 자 가운데서 살리신 이의 영이 너희 안에 거하시면 그리스도 예수를 죽은 자 가운데서 살리신 이가 너희 안에 거하시는 그의 영으로 말미암아 너희 죽을 몸도 살리시리라"}, {"r": "빌립보서 2:6", "text": "그는 근본 하나님의 본체시나 하나님과 동등됨을 취할 것으로 여기지 아니하시고"}, {"n": 7, "text": "오히려 자기를 비워 종의 형체를 가져 사람들과 같이 되었고"}, {"n": 8, "text": "사람의 모양으로 나타나셨으매 자기를 낮추시고 죽기까지 복종하셨으니 곧 십자가에 죽으심이라"}, {"n": 9, "text": "이러므로 하나님이 그를 지극히 높여 모든 이름 위에 뛰어난 이름을 주사"}, {"r": "히브리서 13:8", "text": "예수 그리스도는 어제나 오늘이나 영원토록 동일하시니라"}, {"r": "베드로전서 1:3", "text": "찬송하리로다 우리 주 예수 그리스도의 아버지 하나님이 그 많으신 긍휼대로 예수 그리스도의 죽은 자 가운데서 부활하심으로 말미암아 우리를 거듭나게 하사 산 소망이 있게 하시며"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545352, "folderId": 1790300000000, "title": "성령에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "에스겔 36:26", "text": "또 새 영을 너희 속에 두고 새 마음을 너희에게 주되 너희 육신에서 굳은 마음을 제하고 부드러운 마음을 줄 것이며"}, {"n": 27, "text": "또 내 신을 너희 속에 두어 너희로 내 율례를 행하게 하리니 너희가 내 규례를 지켜 행할찌라"}, {"r": "요엘 2:28", "text": "그 후에 내가 내 신을 만민에게 부어 주리니 너희 자녀들이 장래 일을 말할 것이며 너희 늙은이는 꿈을 꾸며 너희 젊은이는 이상을 볼 것이며"}, {"r": "누가복음 11:13", "text": "너희가 악할찌라도 좋은 것을 자식에게 줄줄 알거든 하물며 너희 천부께서 구하는 자에게 성령을 주시지 않겠느냐 하시니라"}, {"r": "요한복음 3:5", "text": "예수께서 대답하시되 진실로 진실로 네게 이르노니 사람이 물과 성령으로 나지 아니하면 하나님 나라에 들어갈 수 없느니라"}, {"r": "요한복음 14:26", "text": "보혜사 곧 아버지께서 내 이름으로 보내실 성령 그가 너희에게 모든 것을 가르치시고 내가 너희에게 말한 모든 것을 생각나게 하시리라"}, {"r": "요한복음 15:26", "text": "내가 아버지께로서 너희에게 보낼 보혜사 곧 아버지께로서 나오시는 진리의 성령이 오실 때에 그가 나를 증거하실 것이요"}, {"r": "요한복음 16:13", "text": "그러하나 진리의 성령이 오시면 그가 너희를 모든 진리 가운데로 인도하시리니 그가 자의로 말하지 않고 오직 듣는 것을 말하시며 장래 일을 너희에게 알리시리라"}, {"r": "사도행전 1:8", "text": "오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅끝까지 이르러 내 증인이 되리라 하시니라"}, {"r": "사도행전 2:38", "text": "베드로가 가로되 너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 얻으라 그리하면 성령을 선물로 받으리니"}, {"r": "로마서 5:5", "text": "소망이 부끄럽게 아니함은 우리에게 주신 성령으로 말미암아 하나님의 사랑이 우리 마음에 부은바 됨이니"}, {"r": "로마서 8:9", "text": "만일 너희 속에 하나님의 영이 거하시면 너희가 육신에 있지 아니하고 영에 있나니 누구든지 그리스도의 영이 없으면 그리스도의 사람이 아니라"}, {"r": "로마서 8:16", "text": "성령이 친히 우리 영으로 더불어 우리가 하나님의 자녀인 것을 증거하시나니"}, {"r": "로마서 8:26", "text": "이와 같이 성령도 우리 연약함을 도우시나니 우리가 마땅히 빌바를 알지 못하나 오직 성령이 말할 수 없는 탄식으로 우리를 위하여 친히 간구하시느니라"}, {"r": "고린도전서 6:19", "text": "너희 몸은 너희가 하나님께로부터 받은바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희의 것이 아니라"}, {"r": "고린도전서 12:7", "text": "각 사람에게 성령의 나타남을 주심은 유익하게 하려 하심이라"}, {"n": 8, "text": "어떤이에게는 성령으로 말미암아 지혜의 말씀을, 어떤이에게는 같은 성령을 따라 지식의 말씀을,"}, {"n": 9, "text": "다른이에게는 같은 성령으로 믿음을, 어떤이에게는 한 성령으로 병 고치는 은사를,"}, {"n": 10, "text": "어떤이에게는 능력 행함을, 어떤이에게는 예언함을, 어떤이에게는 영들 분별함을, 다른이에게는 각종 방언 말함을, 어떤이에게는 방언들 통역함을 주시나니"}, {"n": 11, "text": "이 모든 일은 같은 한 성령이 행하사 그 뜻대로 각 사람에게 나눠 주시느니라"}, {"r": "갈라디아서 5:22", "text": "오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과"}, {"n": 23, "text": "온유와 절제니 이같은 것을 금지할 법이 없느니라"}, {"r": "에베소서 5:18", "text": "술 취하지 말라 이는 방탕한 것이니 오직 성령의 충만을 받으라"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545353, "folderId": 1790300000000, "title": "예배에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "신명기 5:12", "text": "여호와 너의 하나님이 네게 명한대로 안식일을 지켜 거룩하게 하라"}, {"n": 13, "text": "엿새 동안은 힘써 네 모든 일을 행할 것이나"}, {"n": 14, "text": "제 칠일은 너의 하나님 여호와의 안식인즉 너나 네 아들이나 네 딸이나 네 남종이나 네 여종이나 네 소나 네 나귀나 네 모든 육축이나 네 문 안에 유하는 객이라도 아무 일도 하지 말고 네 남종이나 네 여종으로 너 같이 안식하게 할찌니라"}, {"r": "마태복음 12:8", "text": "인자는 안식일의 주인이니라 하시니라"}, {"r": "요한복음 4:23", "text": "아버지께 참으로 예배하는 자들은 신령과 진정으로 예배할 때가 오나니 곧 이때라 아버지께서는 이렇게 자기에게 예배하는 자들을 찾으시느니라"}, {"n": 24, "text": "하나님은 영이시니 예배하는 자가 신령과 진정으로 예배할찌니라"}, {"r": "로마서 12:1", "text": "그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니 너희 몸을 하나님이 기뻐하시는 거룩한 산 제사로 드리라 이는 너희의 드릴 영적 예배니라"}, {"r": "요한계시록 4:11", "text": "우리 주 하나님이여 영광과 존귀와 능력을 받으시는 것이 합당하오니 주께서 만물을 지으신지라 만물이 주의 뜻대로 있었고 또 지으심을 받았나이다 하더라"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545354, "folderId": 1790300000000, "title": "기도에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "시편 50:15", "text": "환난 날에 나를 부르라 내가 너를 건지리니 네가 나를 영화롭게 하리로다"}, {"r": "시편 145:18", "text": "여호와께서는 자기에게 간구하는 모든 자 곧 진실하게 간구하는 모든 자에게 가까이 하시는도다"}, {"r": "예레미야 29:11", "text": "나 여호와가 말하노라 너희를 향한 나의 생각은 내가 아나니 재앙이 아니라 곧 평안이요 너희 장래에 소망을 주려하는 생각이라"}, {"n": 12, "text": "너희는 내게 부르짖으며 와서 내게 기도하면 내가 너희를 들을 것이요"}, {"n": 13, "text": "너희가 전심으로 나를 찾고 찾으면 나를 만나리라"}, {"r": "예레미야 33:3", "text": "너는 내게 부르짖으라 내가 네게 응답하겠고 네가 알지 못하는 크고 비밀한 일을 네게 보이리라"}, {"r": "다니엘 10:12", "text": "그가 내게 이르되 다니엘아 두려워하지 말라 네가 깨달으려 하여 네 하나님 앞에 스스로 겸비케 하기로 결심하던 첫날부터 네 말이 들으신바 되었으므로 내가 네 말로 인하여 왔느니라"}, {"r": "마태복음 6:33", "text": "너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라"}, {"r": "마태복음 7:7", "text": "구하라 그러면 너희에게 주실 것이요 찾으라 그러면 찾을 것이요 문을 두드리라 그러면 너희에게 열릴 것이니"}, {"r": "마태복음 7:11", "text": "너희가 악한 자라도 좋은 것으로 자식에게 줄줄 알거든 하물며 하늘에 계신 너희 아버지께서 구하는 자에게 좋은 것으로 주시지 않겠느냐"}, {"r": "마태복음 26:41", "text": "시험에 들지 않게 깨어 있어 기도하라 마음에는 원이로되 육신이 약하도다 하시고"}, {"r": "마가복음 11:24", "text": "그러므로 내가 너희에게 말하노니 무엇이든지 기도하고 구하는 것은 받은 줄로 믿으라 그리하면 너희에게 그대로 되리라"}, {"r": "요한복음 14:13", "text": "너희가 내 이름으로 무엇을 구하든지 내가 시행하리니 이는 아버지로 하여금 아들을 인하여 영광을 얻으시게 하려 함이라"}, {"r": "에베소서 6:18", "text": "모든 기도와 간구로 하되 무시로 성령 안에서 기도하고 이를 위하여 깨어 구하기를 항상 힘쓰며 여러 성도를 위하여 구하고"}, {"r": "야고보서 1:5", "text": "너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고 꾸짖지 아니하시는 하나님께 구하라 그리하면 주시리라"}, {"r": "야고보서 5:16", "text": "이러므로 너희 죄를 서로 고하며 병 낫기를 위하여 서로 기도하라 의인의 간구는 역사하는 힘이 많으니라"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545355, "folderId": 1790300000000, "title": "감사에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "시편 50:23", "text": "감사로 제사를 드리는 자가 나를 영화롭게 하나니 그 행위를 옳게 하는 자에게 내가 하나님의 구원을 보이리라"}, {"r": "시편 92:1", "text": "지존자여 십현금과 비파와 수금의 정숙한 소리로 여호와께 감사하며 주의 이름을 찬양하며 아침에 주의 인자하심을 나타내며 밤마다 주의 성실하심을 베풂이 좋으니이다"}, {"r": "시편 100:4", "text": "감사함으로 그 문에 들어가며 찬송함으로 그 궁정에 들어가서 그에게 감사하며 그 이름을 송축할찌어다"}, {"r": "시편 103:2", "text": "내 영혼아 여호와를 송축하며 그 모든 은택을 잊지 말찌어다"}, {"n": 3, "text": "저가 네 모든 죄악을 사하시며 네 모든 병을 고치시며"}, {"n": 4, "text": "네 생명을 파멸에서 구속하시고 인자와 긍휼로 관을 씌우시며"}, {"n": 5, "text": "좋은 것으로 네 소원을 만족케 하사 네 청춘으로 독수리 같이 새롭게 하시는도다"}, {"r": "시편 107:1", "text": "여호와께 감사하라 그는 선하시며 그 인자하심이 영원함이로다"}, {"r": "시편 136:4", "text": "홀로 큰 기사를 행하시는이에게 감사하라 그 인자하심이 영원함이로다"}, {"n": 5, "text": "지혜로 하늘을 지으신이에게 감사하라 그 인자하심이 영원함이로다"}, {"n": 6, "text": "땅을 물 위에 펴신이에게 감사하라 그 인자하심이 영원함이로다"}, {"r": "로마서 8:32", "text": "자기 아들을 아끼지 아니하시고 우리 모든 사람을 위하여 내어주신 이가 어찌 그 아들과 함께 모든 것을 우리에게 은사로 주지 아니하시겠느뇨"}, {"r": "고린도후서 9:15", "text": "말할 수 없는 그의 은사를 인하여 하나님께 감사하노라"}, {"r": "에베소서 1:3", "text": "찬송하리로다 하나님 곧 우리 주 예수 그리스도의 아버지께서 그리스도 안에서 하늘에 속한 모든 신령한 복으로 우리에게 복 주시되"}, {"r": "빌립보서 4:6", "text": "아무 것도 염려하지 말고 오직 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라"}, {"r": "골로새서 3:17", "text": "또 무엇을 하든지 말에나 일에나 다 주 예수의 이름으로 하고 그를 힘입어 하나님 아버지께 감사하라"}, {"r": "데살로니가전서 5:16", "text": "항상 기뻐하라"}, {"n": 17, "text": "쉬지 말고 기도하라"}, {"n": 18, "text": "범사에 감사하라 이는 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라"}, {"r": "야고보서 1:17", "text": "각양 좋은 은사와 온전한 선물이 다 위로부터 빛들의 아버지께로서 내려오나니 그는 변함도 없으시고 회전하는 그림자도 없으시니라"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545356, "folderId": 1790300000000, "title": "관계에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "lines": [{"r": "잠언 17:17", "text": "친구는 사랑이 끊이지 아니하고 형제는 위급한 때까지 위하여 났느니라"}, {"r": "전도서 4:9", "text": "두 사람이 한 사람보다 나음은 저희가 수고함으로 좋은 상을 얻을 것임이라"}, {"n": 10, "text": "혹시 저희가 넘어지면 하나가 그 동무를 붙들어 일으키려니와 홀로 있어 넘어지고 붙들어 일으킬 자가 없는 자에게는 화가 있으리라"}, {"r": "마태복음 5:23", "text": "그러므로 예물을 제단에 드리다가 거기서 네 형제에게 원망 들을만한 일이 있는줄 생각나거든"}, {"n": 24, "text": "예물을 제단 앞에 두고 먼저 가서 형제와 화목하고 그 후에 와서 예물을 드리라"}, {"r": "마가복음 12:31", "text": "둘째는 이것이니 네 이웃을 네 몸과 같이 사랑하라 하신 것이라 이에서 더 큰 계명이 없느니라"}, {"r": "요한복음 13:35", "text": "너희가 서로 사랑하면 이로써 모든 사람이 너희가 내 제자인줄 알리라"}, {"r": "요한복음 15:12", "text": "내 계명은 곧 내가 너희를 사랑한 것 같이 너희도 서로 사랑하라 하는 이것이니라"}, {"r": "로마서 12:10", "text": "형제를 사랑하여 서로 우애하고 존경하기를 서로 먼저 하며"}, {"r": "로마서 12:15", "text": "즐거워하는 자들로 함께 즐거워하고 우는 자들로 함께 울라"}, {"r": "로마서 12:18", "text": "할 수 있거든 너희로서는 모든 사람으로 더불어 평화하라"}, {"r": "갈라디아서 6:2", "text": "너희가 짐을 서로 지라 그리하여 그리스도의 법을 성취하라"}, {"r": "에베소서 4:32", "text": "서로 인자하게 하며 불쌍히 여기며 서로 용서하기를 하나님이 그리스도 안에서 너희를 용서하심과 같이 하라"}, {"r": "에베소서 5:25", "text": "남편들아 아내 사랑하기를 그리스도께서 교회를 사랑하시고 위하여 자신을 주심 같이 하라"}, {"r": "에베소서 5:33", "text": "그러나 너희도 각각 자기의 아내 사랑하기를 자기 같이 하고 아내도 그 남편을 경외하라"}, {"r": "에베소서 6:1", "text": "자녀들아 너희 부모를 주 안에서 순종하라 이것이 옳으니라"}, {"n": 2, "text": "네 아버지와 어머니를 공경하라 이것이 약속 있는 첫계명이니"}, {"n": 3, "text": "이는 네가 잘 되고 땅에서 장수하리라"}, {"n": 4, "text": "또 아비들아 너희 자녀를 노엽게 하지 말고 오직 주의 교양과 훈계로 양육하라"}, {"r": "빌립보서 2:3", "text": "아무 일에든지 다툼이나 허영으로 하지 말고 오직 겸손한 마음으로 각각 자기보다 남을 낫게 여기고"}, {"n": 4, "text": "각각 자기 일을 돌아볼 뿐더러 또한 각각 다른 사람들의 일을 돌아보아 나의 기쁨을 충만케 하라"}, {"r": "히브리서 10:24", "text": "서로 돌아보아 사랑과 선행을 격려하며"}, {"r": "베드로전서 3:8", "text": "마지막으로 말하노니 너희가 다 마음을 같이 하여 체휼하며 형제를 사랑하며 불쌍히 여기며 겸손하며"}], "ref": ""}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545357, "folderId": 1790300000000, "title": "용기에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "신명기 31:6", "text": "너는 마음을 강하게 하고 담대히 하라 그들을 두려워 말라 그들 앞에서 떨지 말라 이는 네 하나님 여호와 그가 너와 함께 행하실 것임이라 반드시 너를 떠나지 아니하시며 버리지 아니하시리라 하고"}, {"r": "신명기 31:8", "text": "여호와 그가 네 앞서 행하시며 너와 함께하사 너를 떠나지 아니하시며 버리지 아니하시리니 너는 두려워 말라 놀라지 말라"}, {"r": "여호수아 1:9", "text": "내가 네게 명한 것이 아니냐 마음을 강하게 하고 담대히 하라 두려워 말며 놀라지 말라 네가 어디로 가든지 네 하나님 여호와가 너와 함께 하느니라 하시니라"}, {"r": "시편 27:1", "text": "여호와는 나의 빛이요 나의 구원이시니 내가 누구를 두려워하리요 여호와는 내 생명의 능력이시니 내가 누구를 무서워하리요"}, {"r": "시편 46:1", "text": "하나님은 우리의 피난처시요 힘이시니 환난 중에 만날 큰 도움이시라"}, {"r": "시편 91:4", "text": "저가 너를 그 깃으로 덮으시리니 네가 그 날개 아래 피하리로다 그의 진실함은 방패와 손 방패가 되나니"}, {"r": "시편 118:6", "text": "여호와는 내 편이시라 내게 두려움이 없나니 사람이 내게 어찌할꼬"}, {"r": "이사야 41:10", "text": "두려워 말라 내가 너와 함께 함이니라 놀라지 말라 나는 네 하나님이 됨이니라 내가 너를 굳세게 하리라 참으로 너를 도와 주리라 참으로 나의 의로운 오른손으로 너를 붙들리라"}, {"r": "이사야 43:1", "text": "야곱아 너를 창조하신 여호와께서 이제 말씀하시느니라 이스라엘아 너를 조성하신 자가 이제 말씀하시느니라 너는 두려워 말라 내가 너를 구속하였고 내가 너를 지명하여 불렀나니 너는 내 것이라"}, {"n": 2, "text": "네가 물 가운데로 지날 때에 내가 함께할 것이라 강을 건널 때에 물이 너를 침몰치 못할 것이며 네가 불 가운데로 행할 때에 타지도 아니할 것이요 불꽃이 너를 사르지도 못하리니"}, {"r": "요한복음 16:33", "text": "이것을 너희에게 이름은 너희로 내 안에서 평안을 누리게 하려함이라 세상에서는 너희가 환난을 당하나 담대하라 내가 세상을 이기었노라 하시니라"}, {"r": "빌립보서 4:13", "text": "내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라"}, {"r": "디모데후서 1:7", "text": "하나님이 우리에게 주신 것은 두려워하는 마음이 아니요 오직 능력과 사랑과 근신하는 마음이니"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545358, "folderId": 1790300000000, "title": "사랑에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "예레미야 31:3", "text": "나 여호와가 옛적에 이스라엘에게 나타나 이르기를 내가 무궁한 사랑으로 너를 사랑하는고로 인자함으로 너를 인도하였다 하였노라"}, {"r": "마태복음 22:37", "text": "예수께서 가라사대 네 마음을 다하고 목숨을 다하고 뜻을 다하여 주 너의 하나님을 사랑하라 하셨으니"}, {"r": "마태복음 22:39", "text": "둘째는 그와 같으니 네 이웃을 네 몸과 같이 사랑하라 하셨으니"}, {"r": "요한복음 3:16", "text": "하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라"}, {"r": "요한복음 13:34", "text": "새 계명을 너희에게 주노니 서로 사랑하라 내가 너희를 사랑한것 같이 너희도 서로 사랑하라"}, {"r": "로마서 5:8", "text": "우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에게 대한 자기의 사랑을 확증하셨느니라"}, {"r": "로마서 8:38", "text": "내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나 능력이나"}, {"n": 39, "text": "높음이나 깊음이나 다른 아무 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라"}, {"r": "고린도전서 13:4", "text": "사랑은 오래 참고 사랑은 온유하며 투기하는 자가 되지 아니하며 사랑은 자랑하지 아니하며 교만하지 아니하며"}, {"r": "고린도전서 13:7", "text": "모든 것을 참으며 모든 것을 믿으며 모든 것을 바라며 모든 것을 견디느니라"}, {"r": "고린도전서 13:13", "text": "그런즉 믿음, 소망, 사랑, 이 세 가지는 항상 있을 것인데 그 중에 제일은 사랑이라"}, {"r": "베드로전서 4:8", "text": "무엇보다도 열심으로 서로 사랑할찌니 사랑은 허다한 죄를 덮느니라"}, {"r": "요한일서 3:18", "text": "자녀들아 우리가 말과 혀로만 사랑하지 말고 오직 행함과 진실함으로 하자"}, {"r": "요한일서 4:8", "text": "사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라"}, {"r": "요한일서 4:19", "text": "우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545359, "folderId": 1790300000000, "title": "회복에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "시편 23:1", "text": "여호와는 나의 목자시니 내가 부족함이 없으리로다"}, {"n": 2, "text": "그가 나를 푸른 초장에 누이시며 쉴만한 물 가으로 인도하시는도다"}, {"n": 3, "text": "내 영혼을 소생시키시고 자기 이름을 위하여 의의 길로 인도하시는도다"}, {"n": 4, "text": "내가 사망의 음침한 골짜기로 다닐찌라도 해를 두려워하지 않을 것은 주께서 나와 함께 하심이라 주의 지팡이와 막대기가 나를 안위하시나이다"}, {"r": "시편 34:18", "text": "여호와는 마음이 상한 자에게 가까이 하시고 중심에 통회하는 자를 구원하시는도다"}, {"r": "시편 42:11", "text": "내 영혼아 네가 어찌하여 낙망하며 어찌하여 내 속에서 불안하여 하는고 너는 하나님을 바라라 나는 내 얼굴을 도우시는 내 하나님을 오히려 찬송하리로다"}, {"r": "시편 121:1", "text": "내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올꼬"}, {"n": 2, "text": "나의 도움이 천지를 지으신 여호와에게서로다"}, {"r": "시편 147:3", "text": "상심한 자를 고치시며 저희 상처를 싸매시는도다"}, {"r": "이사야 40:29", "text": "피곤한 자에게는 능력을 주시며 무능한 자에게는 힘을 더하시나니"}, {"n": 30, "text": "소년이라도 피곤하며 곤비하며 장정이라도 넘어지며 자빠지되"}, {"n": 31, "text": "오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리의 날개치며 올라감 같을 것이요 달음박질하여도 곤비치 아니하겠고 걸어가도 피곤치 아니하리로다"}, {"r": "이사야 58:11", "text": "나 여호와가 너를 항상 인도하여 마른 곳에서도 네 영혼을 만족케 하며 네 뼈를 견고케 하리니 너는 물 댄 동산 같겠고 물이 끊어지지 아니하는 샘 같을 것이라"}, {"r": "예레미야 30:17", "text": "나 여호와가 말하노라 그들이 쫓겨난 자라 하며 찾는 자가 없는 시온이라 한즉 내가 너를 치료하여 네 상처를 낫게 하리라"}, {"r": "호세아 6:1", "text": "오라 우리가 여호와께로 돌아가자 여호와께서 우리를 찢으셨으나 도로 낫게 하실 것이요 우리를 치셨으나 싸매어 주실 것임이라"}, {"r": "마태복음 11:28", "text": "수고하고 무거운 짐진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라"}, {"r": "요한복음 14:1", "text": "너희는 마음에 근심하지 말라 하나님을 믿으니 또 나를 믿으라"}, {"r": "요한복음 14:18", "text": "내가 너희를 고아와 같이 버려두지 아니하고 너희에게로 오리라"}, {"r": "고린도후서 1:3", "text": "찬송하리로다 그는 우리 주 예수 그리스도의 하나님이시요 자비의 아버지시요 모든 위로의 하나님이시며"}, {"n": 4, "text": "우리의 모든 환난 중에서 우리를 위로하사 우리로 하여금 하나님께 받는 위로로써 모든 환난 중에 있는 자들을 능히 위로하게 하시는 이시로다"}, {"r": "베드로전서 5:7", "text": "너희 염려를 다 주께 맡겨 버리라 이는 저가 너희를 권고하심이니라"}, {"r": "요한계시록 21:4", "text": "모든 눈물을 그 눈에서 씻기시매 다시 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790333545360, "folderId": 1790300000000, "title": "인내와 연단에 관한 말씀", "kind": "bible", "blocks": [{"t": "verse", "ref": "", "lines": [{"r": "욥기 23:10", "text": "나의 가는 길을 오직 그가 아시나니 그가 나를 단련하신 후에는 내가 정금 같이 나오리라"}, {"r": "시편 126:5", "text": "눈물을 흘리며 씨를 뿌리는 자는 기쁨으로 거두리로다"}, {"n": 6, "text": "울며 씨를 뿌리러 나가는 자는 정녕 기쁨으로 그 단을 가지고 돌아오리로다"}, {"r": "이사야 43:18", "text": "너희는 이전 일을 기억하지 말며 옛적 일을 생각하지 말라"}, {"n": 19, "text": "보라 내가 새 일을 행하리니 이제 나타낼 것이라 너희가 그것을 알지 못하겠느냐 정녕히 내가 광야에 길과 사막에 강을 내리니"}, {"r": "요한복음 8:12", "text": "예수께서 또 일러 가라사대 나는 세상의 빛이니 나를 따르는 자는 어두움에 다니지 아니하고 생명의 빛을 얻으리라"}, {"r": "로마서 5:3", "text": "다만 이뿐 아니라 우리가 환난 중에도 즐거워하나니 이는 환난은 인내를,"}, {"n": 4, "text": "인내는 연단을, 연단은 소망을 이루는 줄 앎이로다"}, {"r": "로마서 8:18", "text": "생각건대 현재의 고난은 장차 우리에게 나타날 영광과 족히 비교할 수 없도다"}, {"r": "로마서 8:28", "text": "우리가 알거니와 하나님을 사랑하는 자 곧 그 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라"}, {"r": "로마서 12:12", "text": "소망 중에 즐거워하며 환난 중에 참으며 기도에 항상 힘쓰며"}, {"r": "로마서 15:13", "text": "소망의 하나님이 모든 기쁨과 평강을 믿음 안에서 너희에게 충만케 하사 성령의 능력으로 소망이 넘치게 하시기를 원하노라"}, {"r": "고린도전서 10:13", "text": "사람이 감당할 시험 밖에는 너희에게 당한 것이 없나니 오직 하나님은 미쁘사 너희가 감당치 못할 시험 당함을 허락지 아니하시고 시험 당할 즈음에 또한 피할 길을 내사 너희로 능히 감당하게 하시느니라"}, {"r": "갈라디아서 6:9", "text": "우리가 선을 행하되 낙심하지 말찌니 피곤하지 아니하면 때가 이르매 거두리라"}, {"r": "히브리서 10:36", "text": "너희에게 인내가 필요함은 너희가 하나님의 뜻을 행한 후에 약속을 받기 위함이라"}, {"r": "야고보서 1:2", "text": "내 형제들아 너희가 여러가지 시험을 만나거든 온전히 기쁘게 여기라"}, {"n": 3, "text": "이는 너희 믿음의 시련이 인내를 만들어 내는줄 너희가 앎이라"}, {"n": 4, "text": "인내를 온전히 이루라 이는 너희로 온전하고 구비하여 조금도 부족함이 없게 하려 함이라"}, {"r": "야고보서 1:12", "text": "시험을 참는 자는 복이 있도다 이것에 옳다 인정하심을 받은 후에 주께서 자기를 사랑하는 자들에게 약속하신 생명의 면류관을 얻을 것임이니라"}, {"r": "야고보서 5:13", "text": "너희 중에 고난 당하는 자가 있느냐 저는 기도할 것이요 즐거워하는 자가 있느냐 저는 찬송할찌니라"}]}, {"t": "q", "text": "천천히 반복해서 읽고, 마음에 담아보세요."}], "sample": true}, {"id": 1790178308572, "folderId": 1, "title": "한나의 기도", "kind": "bible", "blocks": [{"t": "verse", "ref": "사무엘상 1장", "lines": [{"n": 10, "text": "한나가 마음이 괴로와서 여호와께 기도하고 통곡하며"}, {"n": 11, "text": "서원하여 가로되 만군의 여호와여 만일 주의 여종의 고통을 돌아보시고 나를 생각하시고 주의 여종을 잊지 아니하사 아들을 주시면 내가 그의 평생에 그를 여호와께 드리고 삭도를 그 머리에 대지 아니하겠나이다"}, {"n": 12, "text": "그가 여호와 앞에 오래 기도하는 동안에 엘리가 그의 입을 주목한즉"}, {"n": 13, "text": "한나가 속으로 말하매 입술만 동하고 음성은 들리지 아니하므로 엘리는 그가 취한줄로 생각한지라"}, {"n": 14, "text": "엘리가 그에게 이르되 네가 언제까지 취하여 있겠느냐 포도주를 끊으라"}, {"n": 15, "text": "한나가 대답하여 가로되 나의 주여 그렇지 아니하니이다 나는 마음이 슬픈 여자라 포도주나 독주를 마신 것이 아니요 여호와 앞에 나의 심정을 통한것 뿐이오니"}, {"n": 16, "text": "당신의 여종을 악한 여자로 여기지 마옵소서 내가 지금까지 말한 것은 나의 원통함과 격동됨이 많음을 인함이니이다"}, {"n": 17, "text": "엘리가 대답하여 가로되 평안히 가라 이스라엘의 하나님이 너의 기도하여 구한 것을 허락하시기를 원하노라"}, {"n": 18, "text": "가로되 당신의 여종이 당신께 은혜 입기를 원하나이다 하고 가서 먹고 얼굴에 다시는 수색이 없으니라"}, {"n": 19, "text": "그들이 아침에 일찌기 일어나 여호와 앞에 경배하고 돌아가서 라마의 자기 집에 이르니라 엘가나가 그 아내 한나와 동침하매 여호와께서 그를 생각하신지라"}, {"n": 20, "text": "한나가 잉태하고 때가 이르매 아들을 낳아 사무엘이라 이름하였으니 이는 내가 여호와께 그를 구하였다 함이더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1790005633729, "folderId": 1788947115563, "title": "의인의 범죄와 악인의 회개", "kind": "bible", "blocks": [{"t": "verse", "ref": "에스겔 33장", "lines": [{"n": 10, "text": "그런즉 인자야 너는 이스라엘 족속에게 이르기를 너희가 말하여 이르되 우리의 허물과 죄가 이미 우리에게 있어 우리로 그 중에서 쇠패하게 하니 어찌 능히 살리요 하거니와"}, {"n": 11, "text": "주 여호와의 말씀에 나의 삶을 두고 맹세하노니 나는 악인의 죽는 것을 기뻐하지 아니하고 악인이 그 길에서 돌이켜 떠나서 사는 것을 기뻐하노라 이스라엘 족속아 돌이키고 돌이키라 너희 악한 길에서 떠나라 어찌 죽고자 하느냐 하셨다 하라"}, {"n": 12, "text": "인자야 너는 네 민족에게 이르기를 의인이 범죄하는 날에는 그 의가 구원치 못할 것이요 악인이 돌이켜 그 악에서 떠나는 날에는 그 악이 그를 엎드러뜨리지 못할 것인즉 의인이 범죄하는 날에는 그 의로 인하여는 살지 못하리라"}, {"n": 13, "text": "가령 내가 의인에게 말하기를 너는 살리라 하였다 하자 그가 그 의를 스스로 믿고 죄악을 행하면 그 모든 의로운 행위가 하나도 기억되지 아니하리니 그가 그 지은 죄악 중 곧 그 중에서 죽으리라"}, {"n": 14, "text": "가령 내가 악인에게 말하기를 너는 죽으리라 하였다 하자 그가 돌이켜 자기의 죄에서 떠나서 법과 의대로 행하여"}, {"n": 15, "text": "전당물을 도로 주며 억탈물을 돌려 보내고 생명의 율례를 준행하여 다시는 죄악을 짓지 아니하면 그가 정녕 살고 죽지 않을찌라"}, {"n": 16, "text": "그의 본래 범한 모든 죄가 기억되지 아니하리니 그가 정녕 살리라 이는 법과 의를 행하였음이니라 하라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790002618730, "folderId": 1788947115563, "title": "육체의 일과 성령의 열매", "kind": "bible", "blocks": [{"t": "verse", "ref": "갈라디아서 5장", "lines": [{"n": 16, "text": "내가 이르노니 너희는 성령을 좇아 행하라 그리하면 육체의 욕심을 이루지 아니하리라"}, {"n": 17, "text": "육체의 소욕은 성령을 거스리고 성령의 소욕은 육체를 거스리나니 이 둘이 서로 대적함으로 너희의 원하는 것을 하지 못하게 하려 함이니라"}, {"n": 18, "text": "너희가 만일 성령의 인도하시는 바가 되면 율법 아래 있지 아니하리라"}, {"n": 19, "text": "육체의 일은 현저하니 곧 음행과 더러운 것과 호색과"}, {"n": 20, "text": "우상 숭배와 술수와 원수를 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 분리함과 이단과"}, {"n": 21, "text": "투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한것 같이 경계하노니 이런 일을 하는 자들은 하나님의 나라를 유업으로 받지 못할 것이요"}, {"n": 22, "text": "오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과"}, {"n": 23, "text": "온유와 절제니 이같은 것을 금지할 법이 없느니라"}, {"n": 24, "text": "그리스도 예수의 사람들은 육체와 함께 그 정과 욕심을 십자가에 못 박았느니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790002488828, "folderId": 1788947115563, "title": "행함이 없는 믿음은 죽은것이다", "kind": "bible", "blocks": [{"t": "verse", "ref": "야고보서 2장", "lines": [{"n": 14, "text": "내 형제들아 만일 사람이 믿음이 있노라 하고 행함이 없으면 무슨 이익이 있으리요 그 믿음이 능히 자기를 구원하겠느냐"}, {"n": 15, "text": "만일 형제나 자매가 헐벗고 일용할 양식이 없는데"}, {"n": 16, "text": "너희 중에 누구든지 그에게 이르되 평안히 가라, 더웁게 하라, 배부르게 하라 하며 그 몸에 쓸 것을 주지 아니하면 무슨 이익이 있으리요"}, {"n": 17, "text": "이와 같이 행함이 없는 믿음은 그 자체가 죽은 것이라"}, {"n": 18, "text": "혹이 가로되 너는 믿음이 있고 나는 행함이 있으니 행함이 없는 네 믿음을 내게 보이라 나는 행함으로 내 믿음을 네게 보이리라"}, {"n": 19, "text": "네가 하나님은 한 분이신 줄을 믿느냐 잘하는도다 귀신들도 믿고 떠느니라"}, {"n": 20, "text": "아아 허탄한 사람아 행함이 없는 믿음이 헛 것인줄 알고자 하느냐"}, {"n": 21, "text": "우리 조상 아브라함이 그 아들 이삭을 제단에 드릴 때에 행함으로 의롭다 하심을 받은 것이 아니냐"}, {"n": 22, "text": "네가 보거니와 믿음이 그의 행함과 함께 일하고 행함으로 믿음이 온전케 되었느니라"}, {"n": 23, "text": "이에 경에 이른바 아브라함이 하나님을 믿으니 이것을 의로 여기셨다는 말씀이 응하였고 그는 하나님의 벗이라 칭함을 받았나니"}, {"n": 24, "text": "이로 보건대 사람이 행함으로 의롭다 하심을 받고 믿음으로만 아니니라"}, {"n": 25, "text": "또 이와 같이 기생 라합이 사자를 접대하여 다른 길로 나가게 할 때에 행함으로 의롭다 하심을 받은 것이 아니냐"}, {"n": 26, "text": "영혼 없는 몸이 죽은것 같이 행함이 없는 믿음은 죽은 것이니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790002310131, "folderId": 1788947115563, "title": "원수를 사랑하라", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 5장", "lines": [{"n": 43, "text": "또 네 이웃을 사랑하고 네 원수를 미워하라 하였다는 것을 너희가 들었으나"}, {"n": 44, "text": "나는 너희에게 이르노니 너희 원수를 사랑하며 너희를 핍박하는 자를 위하여 기도하라"}, {"n": 45, "text": "이같이 한즉 하늘에 계신 너희 아버지의 아들이 되리니 이는 하나님이 그 해를 악인과 선인에게 비취게 하시며 비를 의로운 자와 불의한 자에게 내리우심이니라"}, {"n": 46, "text": "너희가 너희를 사랑하는 자를 사랑하면 무슨 상이 있으리요 세리도 이같이 아니하느냐"}, {"n": 47, "text": "또 너희가 너희 형제에게만 문안하면 남보다 더 하는 것이 무엇이냐 이방인들도 이같이 아니하느냐"}, {"n": 48, "text": "그러므로 하늘에 계신 너희 아버지의 온전하심과 같이 너희도 온전하라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790002217360, "folderId": 1788947115563, "title": "심령이 가난한 자는 복이 있나니", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 5장", "lines": [{"n": 1, "text": "예수께서 무리를 보시고 산에 올라가 앉으시니 제자들이 나아온지라"}, {"n": 2, "text": "입을 열어 가르쳐 가라사대"}, {"n": 3, "text": "심령이 가난한 자는 복이 있나니 천국이 저희 것임이요"}, {"n": 4, "text": "애통하는 자는 복이 있나니 저희가 위로를 받을 것임이요"}, {"n": 5, "text": "온유한 자는 복이 있나니 저희가 땅을 기업으로 받을 것임이요"}, {"n": 6, "text": "의에 주리고 목마른 자는 복이 있나니 저희가 배부를 것임이요"}, {"n": 7, "text": "긍휼히 여기는 자는 복이 있나니 저희가 긍휼히 여김을 받을 것임이요"}, {"n": 8, "text": "마음이 청결한 자는 복이 있나니 저희가 하나님을 볼 것임이요"}, {"n": 9, "text": "화평케 하는 자는 복이 있나니 저희가 하나님의 아들이라 일컬음을 받을 것임이요"}, {"n": 10, "text": "의를 위하여 핍박을 받은 자는 복이 있나니 천국이 저희 것임이라"}, {"n": 11, "text": "나를 인하여 너희를 욕하고 핍박하고 거짓으로 너희를 거스려 모든 악한 말을 할 때에는 너희에게 복이 있나니"}, {"n": 12, "text": "기뻐하고 즐거워하라 하늘에서 너희의 상이 큼이라 너희 전에 있던 선지자들을 이같이 핍박하였느니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790002101134, "folderId": 1788947115563, "title": "빛과 소금", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 5장", "lines": [{"n": 13, "text": "너희는 세상의 소금이니 소금이 만일 그 맛을 잃으면 무엇으로 짜게 하리요 후에는 아무 쓸데 없어 다만 밖에 버리워 사람에게 밟힐 뿐이니라"}, {"n": 14, "text": "너희는 세상의 빛이라 산위에 있는 동네가 숨기우지 못할 것이요"}, {"n": 15, "text": "사람이 등불을 켜서 말 아래 두지 아니하고 등경 위에 두나니 이러므로 집안 모든 사람에게 비취느니라"}, {"n": 16, "text": "이같이 너희 빛을 사람 앞에 비취게 하여 저희로 너희 착한 행실을 보고 하늘에 계신 너희 아버지께 영광을 돌리게 하라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790002038633, "folderId": 1788947115563, "title": "너를 지키시는 이", "kind": "bible", "blocks": [{"t": "verse", "ref": "시편 121편", "lines": [{"n": 1, "text": "내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올꼬"}, {"n": 2, "text": "나의 도움이 천지를 지으신 여호와에게서로다"}, {"n": 3, "text": "여호와께서 너로 실족지 않게 하시며 너를 지키시는 자가 졸지 아니하시리로다"}, {"n": 4, "text": "이스라엘을 지키시는 자는 졸지도 아니하고 주무시지도 아니하시리로다"}, {"n": 5, "text": "여호와는 너를 지키시는 자라 여호와께서 네 우편에서 네 그늘이 되시나니"}, {"n": 6, "text": "낮의 해가 너를 상치 아니하며 밤의 달도 너를 해치 아니하리로다"}, {"n": 7, "text": "여호와께서 너를 지켜 모든 환난을 면케 하시며 또 네 영혼을 지키시리로다"}, {"n": 8, "text": "여호와께서 너의 출입을 지금부터 영원까지 지키시리로다"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790000979719, "folderId": 1788947115563, "title": "포도나무 비유", "kind": "bible", "blocks": [{"t": "verse", "ref": "요한복음 15장", "lines": [{"n": 1, "text": "내가 참 포도나무요 내 아버지는 그 농부라"}, {"n": 2, "text": "무릇 내게 있어 과실을 맺지 아니하는 가지는 아버지께서 이를 제해 버리시고 무릇 과실을 맺는 가지는 더 과실을 맺게 하려하여 이를 깨끗케 하시느니라"}, {"n": 3, "text": "너희는 내가 일러준 말로 이미 깨끗하였으니"}, {"n": 4, "text": "내 안에 거하라 나도 너희 안에 거하리라 가지가 포도나무에 붙어 있지 아니하면 절로 과실을 맺을 수 없음 같이 너희도 내 안에 있지 아니하면 그러하리라"}, {"n": 5, "text": "나는 포도나무요 너희는 가지니 저가 내 안에, 내가 저 안에 있으면 이 사람은 과실을 많이 맺나니 나를 떠나서는 너희가 아무 것도 할 수 없음이라"}, {"n": 6, "text": "사람이 내 안에 거하지 아니하면 가지처럼 밖에 버리워 말라지나니 사람들이 이것을 모아다가 불에 던져 사르느니라"}, {"n": 7, "text": "너희가 내 안에 거하고 내 말이 너희 안에 거하면 무엇이든지 원하는대로 구하라 그리하면 이루리라"}, {"n": 8, "text": "너희가 과실을 많이 맺으면 내 아버지께서 영광을 받으실 것이요 너희가 내 제자가 되리라"}, {"n": 9, "text": "아버지께서 나를 사랑하신 것 같이 나도 너희를 사랑하였으니 나의 사랑 안에 거하라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1790000539983, "folderId": 1, "title": "백부장의 믿음", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 8장", "lines": [{"n": 5, "text": "예수께서 가버나움에 들어가시니 한 백부장이 나아와 간구하여"}, {"n": 6, "text": "가로되 주여 내 하인이 중풍병으로 집에 누워 몹시 괴로와하나이다"}, {"n": 7, "text": "가라사대 내가 가서 고쳐 주리라"}, {"n": 8, "text": "백부장이 대답하여 가로되 주여 내 집에 들어오심을 나는 감당치 못하겠사오니 다만 말씀으로만 하옵소서 그러면 내 하인이 낫겠삽나이다"}, {"n": 9, "text": "나도 남의 수하에 있는 사람이요 내 아래도 군사가 있으니 이더러 가라 하면 가고 저더러 오라 하면 오고 내 종더러 이것을 하라 하면 하나이다"}, {"n": 10, "text": "예수께서 들으시고 기이히 여겨 좇는 자들에게 이르시되 내가 진실로 너희에게 이르노니 이스라엘 중 아무에게서도 이만한 믿음을 만나보지 못하였노라"}, {"n": 11, "text": "또 너희에게 이르노니 동서로부터 많은 사람이 이르러 아브라함과 이삭과 야곱과 함께 천국에 앉으려니와"}, {"n": 12, "text": "나라의 본 자손들은 바깥 어두운데 쫓겨나 거기서 울며 이를 갊이 있으리라"}, {"n": 13, "text": "예수께서 백부장에게 이르시되 가라 네 믿은대로 될찌어다 하시니 그 시로 하인이 나으니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1790000360593, "folderId": 1, "title": "스데반의 순교", "kind": "bible", "blocks": [{"t": "verse", "ref": "사도행전 7장", "lines": [{"n": 51, "text": "목이 곧고 마음과 귀에 할례를 받지 못한 사람들아 너희가 항상 성령을 거스려 너희 조상과 같이 너희도 하는도다"}, {"n": 52, "text": "너희 조상들은 선지자 중에 누구를 핍박지 아니하였느냐 의인이 오시리라 예고한 자들을 저희가 죽였고 이제 너희는 그 의인을 잡아준 자요 살인한 자가 되나니"}, {"n": 53, "text": "너희가 천사의 전한 율법을 받고도 지키지 아니하였도다 하니라"}, {"n": 54, "text": "저희가 이말을 듣고 마음에 찔려 저를 향하여 이를 갈거늘"}, {"n": 55, "text": "스데반이 성령이 충만하여 하늘을 우러러 주목하여 하나님의 영광과 및 예수께서 하나님 우편에 서신 것을 보고"}, {"n": 56, "text": "말하되 보라 하늘이 열리고 인자가 하나님 우편에 서신 것을 보노라 한대"}, {"n": 57, "text": "저희가 큰 소리를 지르며 귀를 막고 일심으로 그에게 달려들어"}, {"n": 58, "text": "성 밖에 내치고 돌로 칠쌔 증인들이 옷을 벗어 사울이라 하는 청년의 발앞에 두니라"}, {"n": 59, "text": "저희가 돌로 스데반을 치니 스데반이 부르짖어 가로되 주 예수여 내 영혼을 받으시옵소서 하고"}, {"n": 60, "text": "무릎을 꿇고 크게 불러 가로되 주여 이 죄를 저들에게 돌리지 마옵소서 이 말을 하고 자니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1790000156559, "folderId": 1, "title": "마르다와 마리아", "kind": "bible", "blocks": [{"t": "verse", "ref": "누가복음 10장", "lines": [{"n": 38, "text": "저희가 길 갈 때에 예수께서 한 촌에 들어가시매 마르다라 이름하는 한 여자가 자기 집으로 영접하더라"}, {"n": 39, "text": "그에게 마리아라 하는 동생이 있어 주의 발아래 앉아 그의 말씀을 듣더니"}, {"n": 40, "text": "마르다는 준비하는 일이 많아 마음이 분주한지라 예수께 나아가 가로되 주여 내 동생이 나 혼자 일하게 두는 것을 생각지 아니하시나이까 저를 명하사 나를 도와주라 하소서"}, {"n": 41, "text": "주께서 대답하여 가라사대 마르다야 마르다야 네가 많은 일로 염려하고 근심하나"}, {"n": 42, "text": "그러나 몇 가지만 하든지 혹 한 가지만이라도 족하니라 마리아는 이 좋은 편을 택하였으니 빼앗기지 아니하리라 하시니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789999651044, "folderId": 1788947115563, "title": "지극히 작은 자 하나에게 한 것이", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 25장", "lines": [{"n": 31, "text": "인자가 자기 영광으로 모든 천사와 함께 올때에 자기 영광의 보좌에 앉으리니"}, {"n": 32, "text": "모든 민족을 그 앞에 모으고 각각 분별하기를 목자가 양과 염소를 분별하는것 같이 하여"}, {"n": 33, "text": "양은 그 오른편에, 염소는 왼편에 두리라"}, {"n": 34, "text": "그 때에 임금이 그 오른편에 있는 자들에게 이르시되 내 아버지께 복 받을 자들이여 나아와 창세로부터 너희를 위하여 예비된 나라를 상속하라"}, {"n": 35, "text": "내가 주릴 때에 너희가 먹을 것을 주었고 목마를 때에 마시게 하였고 나그네 되었을 때에 영접하였고"}, {"n": 36, "text": "벗었을 때에 옷을 입혔고 병들었을 때에 돌아보았고 옥에 갇혔을 때에 와서 보았느니라"}, {"n": 37, "text": "이에 의인들이 대답하여 가로되 주여 우리가 어느 때에 주의 주리신 것을 보고 공궤하였으며 목마르신 것을 보고 마시게 하였나이까"}, {"n": 38, "text": "어느 때에 나그네 되신 것을 보고 영접하였으며 벗으신 것을 보고 옷 입혔나이까"}, {"n": 39, "text": "어느 때에 병드신 것이나 옥에 갇히신 것을 보고 가서 뵈었나이까 하리니"}, {"n": 40, "text": "임금이 대답하여 가라사대 내가 진실로 너희에게 이르노니 너희가 여기 내 형제 중에 지극히 작은 자 하나에게 한 것이 곧 내게 한 것이니라 하시고"}, {"n": 41, "text": "또 왼편에 있는 자들에게 이르시되 저주를 받은 자들아 나를 떠나 마귀와 그 사자들을 위하여 예비된 영영한 불에 들어가라"}, {"n": 42, "text": "내가 주릴 때에 너희가 먹을 것을 주지 아니하였고 목마를 때에 마시게 하지 아니하였고"}, {"n": 43, "text": "나그네 되었을 때에 영접하지 아니하였고 벗었을 때에 옷 입히지 아니하였고 병들었을 때와 옥에 갇혔을 때에 돌아보지 아니하였느니라 하시니"}, {"n": 44, "text": "저희도 대답하여 가로되 주여 우리가 어느 때에 주의 주리신 것이나 목마르신 것이나 나그네 되신 것이나 벗으신 것이나 병드신 것이나 옥에 갇히신 것을 보고 공양치 아니하더이까"}, {"n": 45, "text": "이에 임금이 대답하여 가라사대 내가 진실로 너희에게 이르노니 이 지극히 작은 자 하나에게 하지 아니한 것이 곧 내게 하지 아니한 것이니라 하시리니"}, {"n": 46, "text": "저희는 영벌에, 의인들은 영생에 들어가리라 하시니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1789999441409, "folderId": 1788947115563, "title": "달란트 비유", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 25장", "lines": [{"n": 14, "text": "또 어떤 사람이 타국에 갈제 그 종들을 불러 자기 소유를 맡김과 같으니"}, {"n": 15, "text": "각각 그 재능대로 하나에게는 금 다섯 달란트를, 하나에게는 두 달란트를, 하나에게는 한 달란트를 주고 떠났더니"}, {"n": 16, "text": "다섯 달란트 받은 자는 바로 가서 그것으로 장사하여 또 다섯 달란트를 남기고"}, {"n": 17, "text": "두 달란트 받은 자도 그같이 하여 또 두 달란트를 남겼으되"}, {"n": 18, "text": "한 달란트 받은 자는 가서 땅을 파고 그 주인의 돈을 감추어 두었더니"}, {"n": 19, "text": "오랜 후에 그 종들의 주인이 돌아와 저희와 회계할쌔"}, {"n": 20, "text": "다섯 달란트 받았던 자는 다섯 달란트를 더 가지고 와서 가로되 주여 내게 다섯 달란트를 주셨는데 보소서 내가 또 다섯 달란트를 남겼나이다"}, {"n": 21, "text": "그 주인이 이르되 잘 하였도다 착하고 충성된 종아 네가 작은 일에 충성하였으매 내가 많은 것으로 네게 맡기리니 네 주인의 즐거움에 참예할찌어다 하고"}, {"n": 22, "text": "두 달란트 받았던 자도 와서 가로되 주여 내게 두 달란트를 주셨는데 보소서 내가 또 두 달란트를 남겼나이다"}, {"n": 23, "text": "그 주인이 이르되 잘 하였도다 착하고 충성된 종아 네가 작은 일에 충성하였으매 내가 많은 것으로 네게 맡기리니 네 주인의 즐거움에 참예할찌어다 하고"}, {"n": 24, "text": "한 달란트 받았던 자도 와서 가로되 주여 당신은 굳은 사람이라 심지 않은데서 거두고 헤치지 않은데서 모으는 줄을 내가 알았으므로"}, {"n": 25, "text": "두려워하여 나가서 당신의 달란트를 땅에 감추어 두었었나이다 보소서 당신의 것을 받으셨나이다"}, {"n": 26, "text": "그 주인이 대답하여 가로되 악하고 게으른 종아 나는 심지 않은데서 거두고 헤치지 않은데서 모으는 줄로 네가 알았느냐"}, {"n": 27, "text": "그러면 네가 마땅히 내 돈을 취리하는 자들에게나 두었다가 나로 돌아 와서 내 본전과 변리를 받게 할 것이니라 하고"}, {"n": 28, "text": "그에게서 그 한 달란트를 빼앗아 열 달란트 가진 자에게 주어라"}, {"n": 29, "text": "무릇 있는 자는 받아 풍족하게 되고 없는 자는 그 있는 것까지 빼앗기리라"}, {"n": 30, "text": "이 무익한 종을 바깥 어두운데로 내어쫓으라 거기서 슬피 울며 이를 갊이 있으리라 하니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1789999370918, "folderId": 1788947115563, "title": "열처녀 비유", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 25장", "lines": [{"n": 1, "text": "그 때에 천국은 마치 등을 들고 신랑을 맞으러 나간 열 처녀와 같다 하리니"}, {"n": 2, "text": "그 중에 다섯은 미련하고 다섯은 슬기 있는지라"}, {"n": 3, "text": "미련한 자들은 등을 가지되 기름을 가지지 아니하고"}, {"n": 4, "text": "슬기 있는 자들은 그릇에 기름을 담아 등과 함께 가져갔더니"}, {"n": 5, "text": "신랑이 더디 오므로 다 졸며 잘쌔"}, {"n": 6, "text": "밤중에 소리가 나되 보라 신랑이로다 맞으러 나오라 하매"}, {"n": 7, "text": "이에 그 처녀들이 다 일어나 등을 준비할쌔"}, {"n": 8, "text": "미련한 자들이 슬기 있는 자들에게 이르되 우리 등불이 꺼져가니 너희 기름을 좀 나눠 달라 하거늘"}, {"n": 9, "text": "슬기 있는 자들이 대답하여 가로되 우리와 너희의 쓰기에 다 부족할까 하노니 차라리 파는 자들에게 가서 너희 쓸 것을 사라 하니"}, {"n": 10, "text": "저희가 사러 간 동안에 신랑이 오므로 예비하였던 자들은 함께 혼인 잔치에 들어가고 문은 닫힌지라"}, {"n": 11, "text": "그 후에 남은 처녀들이 와서 가로되 주여 주여 우리에게 열어 주소서"}, {"n": 12, "text": "대답하여 가로되 진실로 너희에게 이르노니 내가 너희를 알지 못하노라 하였느니라"}, {"n": 13, "text": "그런즉 깨어 있으라 너희는 그 날과 그 시를 알지 못하느니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1789999167740, "folderId": 1, "title": "부자 청년", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 19장", "lines": [{"n": 16, "text": "어떤 사람이 주께 와서 가로되 선생님이여 내가 무슨 선한 일을 하여야 영생을 얻으리이까"}, {"n": 17, "text": "예수께서 가라사대 어찌하여 선한 일을 내게 묻느냐 선한이는 오직 한 분이시니라 네가 생명에 들어 가려면 계명들을 지키라"}, {"n": 18, "text": "가로되 어느 계명이오니이까 예수께서 가라사대 살인하지 말라, 간음하지 말라, 도적질하지 말라, 거짓증거하지 말라,"}, {"n": 19, "text": "네 부모를 공경하라, 네 이웃을 네 몸과 같이 사랑하라 하신 것이니라"}, {"n": 20, "text": "그 청년이 가로되 이 모든 것을 내가 지키었사오니 아직도 무엇이 부족하니이까"}, {"n": 21, "text": "예수께서 가라사대 네가 온전하고자 할찐대 가서 네 소유를 팔아 가난한 자들을 주라 그리하면 하늘에서 보화가 네게 있으리라 그리고 와서 나를 좇으라 하시니"}, {"n": 22, "text": "그 청년이 재물이 많으므로 이 말씀을 듣고 근심하며 가니라"}, {"n": 23, "text": "예수께서 제자들에게 이르시되 내가 진실로 너희에게 이르노니 부자는 천국에 들어가기가 어려우니라"}, {"n": 24, "text": "다시 너희에게 말하노니 약대가 바늘귀로 들어가는 것이 부자가 하나님의 나라에 들어가는 것보다 쉬우니라 하신대"}, {"n": 25, "text": "제자들이 듣고 심히 놀라 가로되 그런즉 누가 구원을 얻을 수 있으리이까"}, {"n": 26, "text": "예수께서 저희를 보시며 가라사대 사람으로는 할 수 없으되 하나님으로서는 다 할 수 있느니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789999032010, "folderId": 1788947115563, "title": "베드로의 고백과 천국 열쇠", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 16장", "lines": [{"n": 13, "text": "예수께서 가이사랴 빌립보 지방에 이르러 제자들에게 물어 가라사대 사람들이 인자를 누구라 하느냐"}, {"n": 14, "text": "가로되 더러는 세례 요한, 더러는 엘리야, 어떤이는 예레미야나 선지자 중의 하나라 하나이다"}, {"n": 15, "text": "가라사대 너희는 나를 누구라 하느냐"}, {"n": 16, "text": "시몬 베드로가 대답하여 가로되 주는 그리스도시요 살아계신 하나님의 아들이시니이다"}, {"n": 17, "text": "예수께서 대답하여 가라사대 바요나 시몬아 네가 복이 있도다 이를 네게 알게 한 이는 혈육이 아니요 하늘에 계신 내 아버지시니라"}, {"n": 18, "text": "또 내가 네게 이르노니 너는 베드로라 내가 이 반석 위에 내 교회를 세우리니 음부의 권세가 이기지 못하리라"}, {"n": 19, "text": "내가 천국 열쇠를 네게 주리니 네가 땅에서 무엇이든지 매면 하늘에서도 매일 것이요 네가 땅에서 무엇이든지 풀면 하늘에서도 풀리리라 하시고"}, {"n": 20, "text": "이에 제자들을 경계하사 자기가 그리스도인 것을 아무에게도 이르지 말라 하시니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1789998886753, "folderId": 1, "title": "오병이어의 기적", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 14장", "lines": [{"n": 13, "text": "예수께서 들으시고 배를 타고 떠나사 따로 빈 들에 가시니 무리가 듣고 여러 고을로부터 걸어서 좇아간지라"}, {"n": 14, "text": "예수께서 나오사 큰 무리를 보시고 불쌍히 여기사 그 중에 있는 병인을 고쳐 주시니라"}, {"n": 15, "text": "저녁이 되매 제자들이 나아와 가로되 이곳은 빈 들이요 때도 이미 저물었으니 무리를 보내어 마을에 들어가 먹을 것을 사먹게 하소서"}, {"n": 16, "text": "예수께서 가라사대 갈것 없다 너희가 먹을 것을 주어라"}, {"n": 17, "text": "제자들이 가로되 여기 우리에게 있는 것은 떡 다섯 개와 물고기 두 마리 뿐이니이다"}, {"n": 18, "text": "가라사대 그것을 내게 가져오라 하시고"}, {"n": 19, "text": "무리를 명하여 잔디 위에 앉히시고 떡 다섯 개와 물고기 두 마리를 가지사 하늘을 우러러 축사하시고 떡을 떼어 제자들에게 주시매 제자들이 무리에게 주니"}, {"n": 20, "text": "다 배불리 먹고 남은 조각을 열 두 바구니에 차게 거두었으며"}, {"n": 21, "text": "먹은 사람은 여자와 아이 외에 오천 명이나 되었더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789998262713, "folderId": 1788947115563, "title": "씨 뿌리는 비유", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 13장", "lines": [{"n": 18, "text": "그런즉 씨 뿌리는 비유를 들으라"}, {"n": 19, "text": "아무나 천국 말씀을 듣고 깨닫지 못할 때는 악한 자가 와서 그 마음에 뿌리운 것을 빼앗나니 이는 곧 길 가에 뿌리운 자요"}, {"n": 20, "text": "돌밭에 뿌리웠다는 것은 말씀을 듣고 즉시 기쁨으로 받되"}, {"n": 21, "text": "그 속에 뿌리가 없어 잠시 견디다가 말씀을 인하여 환난이나 핍박이 일어나는 때에는 곧 넘어지는 자요"}, {"n": 22, "text": "가시떨기에 뿌리웠다는 것은 말씀을 들으나 세상의 염려와 재리의 유혹에 말씀이 막혀 결실치 못하는 자요"}, {"n": 23, "text": "좋은 땅에 뿌리웠다는 것은 말씀을 듣고 깨닫는 자니 결실하여 혹 백배, 혹 육십배, 혹 삼십배가 되느니라 하시더라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1789998173768, "folderId": 1, "title": "광야에서 시험 받으신 예수님", "kind": "bible", "blocks": [{"t": "verse", "ref": "마태복음 4장", "lines": [{"n": 1, "text": "그 때에 예수께서 성령에게 이끌리어 마귀에게 시험을 받으러 광야로 가사"}, {"n": 2, "text": "사십 일을 밤낮으로 금식하신 후에 주리신지라"}, {"n": 3, "text": "시험하는 자가 예수께 나아와서 가로되 네가 만일 하나님의 아들이어든 명하여 이 돌들이 떡덩이가 되게 하라"}, {"n": 4, "text": "예수께서 대답하여 가라사대 기록되었으되 사람이 떡으로만 살것이 아니요 하나님의 입으로 나오는 모든 말씀으로 살 것이라 하였느니라 하시니"}, {"n": 5, "text": "이에 마귀가 예수를 거룩한 성으로 데려다가 성전 꼭대기에 세우고"}, {"n": 6, "text": "가로되 네가 만일 하나님의 아들이어든 뛰어내리라 기록하였으되 저가 너를 위하여 그 사자들을 명하시리니 저희가 손으로 너를 받들어 발이 돌에 부딪히지 않게 하리로다 하였느니라"}, {"n": 7, "text": "예수께서 이르시되 또 기록되었으되 주 너의 하나님을 시험치 말라 하였느니라 하신대"}, {"n": 8, "text": "마귀가 또 그를 데리고 지극히 높은 산으로 가서 천하 만국과 그 영광을 보여"}, {"n": 9, "text": "가로되 만일 내게 엎드려 경배하면 이 모든 것을 네게 주리라"}, {"n": 10, "text": "이에 예수께서 말씀하시되 사단아 물러가라 기록되었으되 주 너의 하나님께 경배하고 다만 그를 섬기라 하였느니라"}, {"n": 11, "text": "이에 마귀는 예수를 떠나고 천사들이 나아와서 수종드니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789833359407, "folderId": 1788947115563, "title": "여호와의 장막에 머무를 자", "kind": "bible", "blocks": [{"t": "verse", "ref": "시편 15편", "lines": [{"n": 1, "text": "여호와여 주의 장막에 유할 자 누구오며 주의 성산에 거할 자 누구오니이까"}, {"n": 2, "text": "정직하게 행하며 공의를 일삼으며 그 마음에 진실을 말하며"}, {"n": 3, "text": "그 혀로 참소치 아니하고 그 벗에게 행악지 아니하며 그 이웃을 훼방치 아니하며"}, {"n": 4, "text": "그 눈은 망령된 자를 멸시하며 여호와를 두려워하는 자를 존대하며 그 마음에 서원한 것은 해로울찌라도 변치 아니하며"}, {"n": 5, "text": "변리로 대금치 아니하며 뇌물을 받고 무죄한 자를 해치 아니하는 자니 이런 일을 행하는 자는 영영히 요동치 아니하리이다"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1789833051135, "folderId": 1788947115563, "title": "복있는 사람", "kind": "bible", "blocks": [{"t": "verse", "ref": "시편 1편", "lines": [{"n": 1, "text": "복 있는 사람은 악인의 꾀를 좇지 아니하며 죄인의 길에 서지 아니하며 오만한 자의 자리에 앉지 아니하고"}, {"n": 2, "text": "오직 여호와의 율법을 즐거워하여 그 율법을 주야로 묵상하는 자로다"}, {"n": 3, "text": "저는 시냇가에 심은 나무가 시절을 좇아 과실을 맺으며 그 잎사귀가 마르지 아니함 같으니 그 행사가 다 형통하리로다"}, {"n": 4, "text": "악인은 그렇지 않음이여 오직 바람에 나는 겨와 같도다"}, {"n": 5, "text": "그러므로 악인이 심판을 견디지 못하며 죄인이 의인의 회중에 들지 못하리로다"}, {"n": 6, "text": "대저 의인의 길은 여호와께서 인정하시나 악인의 길은 망하리로다"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1789832920981, "folderId": 1788947115563, "title": "여호와는 나의 목자시니", "kind": "bible", "blocks": [{"t": "verse", "ref": "시편 23편", "lines": [{"n": 1, "text": "여호와는 나의 목자시니 내가 부족함이 없으리로다"}, {"n": 2, "text": "그가 나를 푸른 초장에 누이시며 쉴만한 물 가으로 인도하시는도다"}, {"n": 3, "text": "내 영혼을 소생시키시고 자기 이름을 위하여 의의 길로 인도하시는도다"}, {"n": 4, "text": "내가 사망의 음침한 골짜기로 다닐찌라도 해를 두려워하지 않을 것은 주께서 나와 함께 하심이라 주의 지팡이와 막대기가 나를 안위하시나이다"}, {"n": 5, "text": "주께서 내 원수의 목전에서 내게 상을 베푸시고 기름으로 내 머리에 바르셨으니 내 잔이 넘치나이다"}, {"n": 6, "text": "나의 평생에 선하심과 인자하심이 정녕 나를 따르리니 내가 여호와의 집에 영원히 거하리로다"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1789832779639, "folderId": 1788947115563, "title": "십계명의 선포", "kind": "bible", "blocks": [{"t": "verse", "ref": "출애굽기 20장", "lines": [{"n": 1, "text": "하나님이 이 모든 말씀으로 일러 가라사대"}, {"n": 2, "text": "나는 너를 애굽 땅, 종 되었던 집에서 인도하여 낸 너의 하나님 여호와로라"}, {"n": 3, "text": "너는 나 외에는 다른 신들을 네게 있게 말찌니라"}, {"n": 4, "text": "너를 위하여 새긴 우상을 만들지 말고 또 위로 하늘에 있는 것이나 아래로 땅에 있는 것이나 땅아래 물속에 있는 것의 아무 형상이든지 만들지 말며"}, {"n": 5, "text": "그것들에게 절하지 말며 그것들을 섬기지 말라 나 여호와 너의 하나님은 질투하는 하나님인즉 나를 미워하는 자의 죄를 갚되 아비로부터 아들에게로 삼 사대까지 이르게 하거니와"}, {"n": 6, "text": "나를 사랑하고 내 계명을 지키는 자에게는 천대까지 은혜를 베푸느니라"}, {"n": 7, "text": "너는 너의 하나님 여호와의 이름을 망령되이 일컫지 말라 나 여호와는 나의 이름을 망령되이 일컫는 자를 죄 없다 하지 아니하리라"}, {"n": 8, "text": "안식일을 기억하여 거룩히 지키라"}, {"n": 9, "text": "엿새 동안은 힘써 네 모든 일을 행할 것이나"}, {"n": 10, "text": "제 칠일은 너의 하나님 여호와의 안식일인즉 너나 네 아들이나 네 딸이나 네 남종이나 네 여종이나 네 육축이나 네 문안에 유하는 객이라도 아무 일도 하지 말라"}, {"n": 11, "text": "이는 엿새 동안에 나 여호와가 하늘과 땅과 바다와 그 가운데 모든 것을 만들고 제 칠일에 쉬었음이라 그러므로 나 여호와가 안식일을 복되게 하여 그 날을 거룩하게 하였느니라"}, {"n": 12, "text": "네 부모를 공경하라 그리하면 너의 하나님 나 여호와가 네게 준 땅에서 네 생명이 길리라"}, {"n": 13, "text": "살인하지 말찌니라"}, {"n": 14, "text": "간음하지 말찌니라"}, {"n": 15, "text": "도적질하지 말찌니라"}, {"n": 16, "text": "네 이웃에 대하여 거짓 증거하지 말찌니라"}, {"n": 17, "text": "네 이웃의 집을 탐내지 말찌니라 네 이웃의 아내나 그의 남종이나 그의 여종이나 그의 소나 그의 나귀나 무릇 네 이웃의 소유를 탐내지 말찌니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1789832449407, "folderId": 1788947115563, "title": "이사야의 예수님에 대한 예언", "kind": "bible", "blocks": [{"t": "verse", "ref": "이사야 53장", "lines": [{"n": 1, "text": "우리의 전한 것을 누가 믿었느뇨 여호와의 팔이 뉘게 나타났느뇨"}, {"n": 2, "text": "그는 주 앞에서 자라나기를 연한 순 같고 마른 땅에서 나온 줄기 같아서 고운 모양도 없고 풍채도 없은즉 우리의 보기에 흠모할만한 아름다운 것이 없도다"}, {"n": 3, "text": "그는 멸시를 받아서 사람에게 싫어 버린바 되었으며 간고를 많이 겪었으며 질고를 아는 자라 마치 사람들에게 얼굴을 가리우고 보지 않음을 받는 자 같아서 멸시를 당하였고 우리도 그를 귀히 여기지 아니하였도다"}, {"n": 4, "text": "그는 실로 우리의 질고를 지고 우리의 슬픔을 당하였거늘 우리는 생각하기를 그는 징벌을 받아서 하나님에게 맞으며 고난을 당한다 하였노라"}, {"n": 5, "text": "그가 찔림은 우리의 허물을 인함이요 그가 상함은 우리의 죄악을 인함이라 그가 징계를 받음으로 우리가 평화를 누리고 그가 채찍에 맞음으로 우리가 나음을 입었도다"}, {"n": 6, "text": "우리는 다 양 같아서 그릇 행하여 각기 제 길로 갔거늘 여호와께서는 우리 무리의 죄악을 그에게 담당시키셨도다"}, {"n": 7, "text": "그가 곤욕을 당하여 괴로울 때에도 그 입을 열지 아니하였음이여 마치 도수장으로 끌려가는 어린 양과 털 깎는 자 앞에 잠잠한 양 같이 그 입을 열지 아니하였도다"}, {"n": 8, "text": "그가 곤욕과 심문을 당하고 끌려 갔으니 그 세대 중에 누가 생각하기를 그가 산 자의 땅에서 끊어짐은 마땅히 형벌 받을 내 백성의 허물을 인함이라 하였으리요"}, {"n": 9, "text": "그는 강포를 행치 아니하였고 그 입에 궤사가 없었으나 그 무덤이 악인과 함께 되었으며 그 묘실이 부자와 함께 되었도다"}, {"n": 10, "text": "여호와께서 그로 상함을 받게 하시기를 원하사 질고를 당케 하셨은즉 그 영혼을 속건제물로 드리기에 이르면 그가 그 씨를 보게 되며 그 날은 길 것이요 또 그의 손으로 여호와의 뜻을 성취하리로다"}, {"n": 11, "text": "가라사대 그가 자기 영혼의 수고한 것을 보고 만족히 여길 것이라 나의 의로운 종이 자기 지식으로 많은 사람을 의롭게 하며 또 그들의 죄악을 친히 담당하리라"}, {"n": 12, "text": "이러므로 내가 그로 존귀한 자와 함께 분깃을 얻게 하며 강한 자와 함께 탈취한 것을 나누게 하리니 이는 그가 자기 영혼을 버려 사망에 이르게 하며 범죄자 중 하나로 헤아림을 입었음이라 그러나 실상은 그가 많은 사람의 죄를 지며 범죄자를 위하여 기도하였느니라 하시니라"}]}, {"t": "q", "text": "오늘 유독 눈길이 머문 구절은 무엇인가요?\n그 말씀이 비추는 내 삶의 자리에 가만히 머물러보고,\n그 마음을 품고 기도하며, 오늘 실천할 작은 한 걸음을 찾아보아요."}], "sample": true}, {"id": 1789832086328, "folderId": 1, "title": "히스기야의 교만", "kind": "bible", "blocks": [{"t": "verse", "ref": "열왕기하 20장", "lines": [{"n": 12, "text": "그 때에 발라단의 아들 바벨론 왕 부로닥발라단이 히스기야가 병 들었다 함을 듣고 편지와 예물을 저에게 보낸지라"}, {"n": 13, "text": "히스기야가 사자의 말을 듣고 자기 보물고의 금은과 향품과 보배로운 기름과 그 군기고와 내탕고의 모든 것을 다 사자에게 보였는데 무릇 왕궁과 그 나라 안에 있는 것을 저에게 보이지 아니한 것이 없으니라"}, {"n": 14, "text": "선지자 이사야가 히스기야왕에게 나아와서 이르되 이 사람들이 무슨 말을 하였으며 어디서부터 왕에게 왔나이까 히스기야가 가로되 먼 지방 바벨론에서 왔나이다"}, {"n": 15, "text": "이사야가 가로되 저희가 왕궁에서 무엇을 보았나이까 히스기야가 대답하되 내 궁에 있는 것을 저희가 다 보았나니 나의 내탕고에서 하나도 보이지 아니한 것이 없나이다"}, {"n": 16, "text": "이사야가 히스기야에게 이르되 여호와의 말씀을 들으소서"}, {"n": 17, "text": "여호와의 말씀이 날이 이르리니 무릇 왕궁의 모든 것과 왕의 열조가 오늘까지 쌓아 두었던 것을 바벨론으로 옮긴바 되고 하나도 남지 아니할 것이요"}, {"n": 18, "text": "또 왕의 몸에서 날 아들 중에서 사로잡혀 바벨론 왕궁의 환관이 되리라 하셨나이다"}, {"n": 19, "text": "히스기야가 이사야에게 이르되 당신의 전한바 여호와의 말씀이 선하니이다 하고 또 가로되 만일 나의 사는 날에 태평과 진실이 있을찐대 어찌 선하지 아니하리요 하니라"}, {"n": 20, "text": "히스기야의 남은 사적과 그 모든 권력과 못과 수도를 만들어 물을 성중으로 인도하여 들인 일은 유다 왕 역대지략에 기록되지 아니하였느냐"}, {"n": 21, "text": "히스기야가 그 열조와 함께 자고 그 아들 므낫세가 대신하여 왕이 되니라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789831978940, "folderId": 1, "title": "히스기야의 기도", "kind": "bible", "blocks": [{"t": "verse", "ref": "열왕기하 20장", "lines": [{"n": 1, "text": "그 때에 히스기야가 병들어 죽게 되매 아모스의 아들 선지자 이사야가 저에게 나아와서 이르되 여호와의 말씀이 너는 집을 처치하라 네가 죽고 살지 못하리라 하셨나이다"}, {"n": 2, "text": "히스기야가 낯을 벽으로 향하고 여호와께 기도하여 가로되"}, {"n": 3, "text": "여호와여 구하오니 내가 진실과 전심으로 주 앞에 행하며 주의 보시기에 선하게 행한 것을 기억하옵소서 하고 심히 통곡하더라"}, {"n": 4, "text": "이사야가 성읍 가운데까지도 이르기 전에 여호와의 말씀이 저에게 임하여 가라사대"}, {"n": 5, "text": "너는 돌아가서 내 백성의 주권자 히스기야에게 이르기를 왕의 조상 다윗의 하나님 여호와의 말씀이 내가 네 기도를 들었고 네 눈물을 보았노라 내가 너를 낫게 하리니 네가 삼일만에 여호와의 전에 올라가겠고"}, {"n": 6, "text": "내가 네 날을 십 오년을 더할것이며 내가 너와 이 성을 앗수르 왕의 손에서 구원하고 내가 나를 위하고 또 내 종 다윗을 위하므로 이 성을 보호하리라 하셨다 하라 하셨더라"}, {"n": 7, "text": "이사야가 가로되 무화과 반죽을 가져오라 하매 무리가 가져다가 그 종처에 놓으니 나으니라"}, {"n": 8, "text": "히스기야가 이사야에게 이르되 여호와께서 나를 낫게 하시고 삼일만에 여호와의 전에 올라가게 하실 무슨 징조가 있나이까"}, {"n": 9, "text": "이사야가 가로되 여호와의 하신 말씀을 응하게 하실 일에 대하여 여호와께로서 왕에게 한 징조가 임하리이다 해 그림자가 십도를 나아갈 것이니이까 혹 십도를 물러갈 것이니이까"}, {"n": 10, "text": "히스기야가 대답하되 그림자가 십도를 나아가기는 쉬우니 그리할 것이 아니라 십도가 물러갈 것이니이다"}, {"n": 11, "text": "선지자 이사야가 여호와께 간구하매 아하스의 일영표 위에 나아갔던 해 그림자로 십도를 물러가게 하셨더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789831341467, "folderId": 1, "title": "야곱과 씨름", "kind": "bible", "blocks": [{"t": "verse", "ref": "창세기 32장", "lines": [{"n": 6, "text": "사자들이 야곱에게 돌아와 가로되 우리가 주인의 형 에서에게 이른즉 그가 사백인을 거느리고 주인을 만나려고 오더이다"}, {"n": 7, "text": "야곱이 심히 두렵고 답답하여 자기와 함께한 종자와 양과 소와 약대를 두 떼로 나누고"}, {"n": 8, "text": "가로되 에서가 와서 한 떼를 치면 남은 한 떼는 피하리라 하고"}]}, {"t": "memo", "text": "(중략)"}, {"t": "verse", "ref": "", "lines": [{"n": 22, "text": "밤에 일어나 두 아내와 두 여종과 열 한 아들을 인도하여 얍복 나루를 건널쌔"}, {"n": 23, "text": "그들을 인도하여 시내를 건네며 그 소유도 건네고"}, {"n": 24, "text": "야곱은 홀로 남았더니 어떤 사람이 날이 새도록 야곱과 씨름하다가"}, {"n": 25, "text": "그 사람이 자기가 야곱을 이기지 못함을 보고 야곱의 환도뼈를 치매 야곱의 환도뼈가 그 사람과 씨름할 때에 위골되었더라"}, {"n": 26, "text": "그 사람이 가로되 날이 새려하니 나로 가게 하라 야곱이 가로되 당신이 내게 축복하지 아니하면 가게 하지 아니하겠나이다"}, {"n": 27, "text": "그 사람이 그에게 이르되 네 이름이 무엇이냐 그가 가로되 야곱이니이다"}, {"n": 28, "text": "그 사람이 가로되 네 이름을 다시는 야곱이라 부를 것이 아니요 이스라엘이라 부를 것이니 이는 네가 하나님과 사람으로 더불어 겨루어 이기었음이니라"}, {"n": 29, "text": "야곱이 청하여 가로되 당신의 이름을 고하소서 그 사람이 가로되 어찌 내 이름을 묻느냐 하고 거기서 야곱에게 축복한지라"}, {"n": 30, "text": "그러므로 야곱이 그곳 이름을 브니엘이라 하였으니 그가 이르기를 내가 하나님과 대면하여 보았으나 내 생명이 보전되었다 함이더라"}]}, {"t": "q", "text": "오늘 마음이 머문 구절이 있나요?\n그 말씀을 가만히 내 삶에 비춰보고,\n그 마음을 품고 짧게 기도해보아요."}], "sample": true}, {"id": 1789829252820, "folderId": 1, "title": "홍해를 가르신 하나님", "kind": "bible", "blocks": [{"t": "verse", "ref": "출애굽기 14장", "lines": [{"n": 15, "text": "여호와께서 모세에게 이르시되 너는 어찌하여 내게 부르짖느뇨 이스라엘 자손을 명하여 앞으로 나가게 하고"}, {"n": 16, "text": "지팡이를 들고 손을 바다 위로 내밀어 그것으로 갈라지게 하라 이스라엘 자손이 바다 가운데 육지로 행하리라"}, {"n": 17, "text": "내가 애굽 사람들의 마음을 강퍅케 할것인즉 그들이 그 뒤를 따라 들어갈 것이라 내가 바로와 그 모든 군대와 그 병거와 마병을 인하여 영광을 얻으리니"}, {"n": 18, "text": "내가 바로와 그 병거와 마병으로 인하여 영광을 얻을 때에야 애굽 사람들이 나를 여호와인줄 알리라 하시더니"}, {"n": 19, "text": "이스라엘 진 앞에 행하던 하나님의 사자가 옮겨 그 뒤로 행하매 구름 기둥도 앞에서 그 뒤로 옮겨"}, {"n": 20, "text": "애굽 진과 이스라엘 진 사이에 이르러 서니 저 편은 구름과 흑암이 있고 이 편은 밤이 광명하므로 밤새도록 저 편이 이 편에 가까이 못하였더라"}, {"n": 21, "text": "모세가 바다 위로 손을 내어민대 여호와께서 큰 동풍으로 밤새도록 바닷물을 물러가게 하시니 물이 갈라져 바다가 마른 땅이 된지라"}, {"n": 22, "text": "이스라엘 자손이 바다 가운데 육지로 행하고 물은 그들의 좌우에 벽이 되니"}, {"n": 23, "text": "애굽 사람들과 바로의 말들, 병거들과 그 마병들이 다 그 뒤를 쫓아 바다 가운데로 들어 오는지라"}, {"n": 24, "text": "새벽에 여호와께서 불 구름기둥 가운데서 애굽
